title = "BigBase gitleaks config"

# Extend (not replace) gitleaks' default detection rules.
[extend]
useDefault = true

# Two known documentation/fixture placeholders that read as secrets to the
# generic-api-key rule. Scoped by path AND exact fake value (matchCondition
# = "and") so a real secret added later to either file still fails the scan.
[[allowlists]]
description = "api-design skill doc — fake example token in a curl snippet"
matchCondition = "and"
paths = ['''\.opencode/skills/api-design/SKILL\.md''']
regexes = ['''sk_live_abc123''']

[[allowlists]]
description = "UI mock data fixture — fake cache-key placeholder"
matchCondition = "and"
paths = ['''ui/src/lib/sitesData\.ts''']
regexes = ['''a1b2c3d4e5f6''']

[[allowlists]]
description = "archived e48 verification doc — fake HEALTH_TOKEN example value"
matchCondition = "and"
paths = ['''specs/epics/archive/e48-live-surface-hardening/e48s01-git-health-block\.md''']
regexes = ['''secret123''']
