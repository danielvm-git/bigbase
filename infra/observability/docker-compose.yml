# BigBase Observability Stack
# Prometheus + Grafana + Loki + Promtail + Uptime Kuma
#
# Usage:
#   cp .env.example .env          # set BIGBASE_HOST and passwords
#   docker compose up -d
#
# Ports (bind to 127.0.0.1 — expose via nginx/caddy with auth):
#   Grafana    → http://localhost:3000
#   Prometheus → http://localhost:9090  (internal only)
#   Uptime Kuma→ http://localhost:3001

version: "3.9"

networks:
  observability:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  uptime_kuma_data:

services:
  # ──────────────────────────────────────────────
  # Prometheus — scrapes BigBase /metrics/prometheus
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: bb_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - observability

  # ──────────────────────────────────────────────
  # Loki — log aggregation backend
  # ──────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.7
    container_name: bb_loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability

  # ──────────────────────────────────────────────
  # Promtail — ships BigBase logs to Loki
  # ──────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.7
    container_name: bb_promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /run/docker.sock:/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - observability

  # ──────────────────────────────────────────────
  # Grafana — dashboards para Prometheus + Loki
  # ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: bb_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - observability

  # ──────────────────────────────────────────────
  # Uptime Kuma — uptime dos sites no BigBase
  # ──────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: bb_uptime_kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - observability
