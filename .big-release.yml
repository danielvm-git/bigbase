# big-release configuration
# Reference: https://github.com/danielvm-git/big-release/discussions/72
# Zero-dependency automated releases via Conventional Commits.
tagFormat: "v${version}"
initialVersion: "2.92.0"

plugins:
  - changelog
  - versionfile
  - git
  - github

pluginConfigs:
  git:
    # Staged into the release commit alongside the tag. The default commit
    # message is "chore(release): <version> [skip ci]"; set explicitly
    # so the [skip ci] guard against a release loop is unmistakable.
    assets:
      - CHANGELOG.md
    postTagAssets:
      - VERSION
    message: "chore(release): ${version} [skip ci]"

versionFile:
  path: VERSION
  template: "{{.Version}}"
