# PR-Agent automated code review
# Uses qodo-ai/pr-agent with DeepSeek API (OpenAI-compatible endpoint)
# Triggers on PR events + slash commands via issue_comment
#
# Sync with CONVENTIONS.md when conventions change
name: PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          # PR-Agent expects OPENAI_KEY (not OPENAI__KEY) for LiteLLM
          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI__KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI__API_BASE: https://api.deepseek.com/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.model: "deepseek-v4-pro"
          # Duplicate for tools that read env vars directly vs via config
          OPENAI__MODEL: "deepseek-v4-pro"
