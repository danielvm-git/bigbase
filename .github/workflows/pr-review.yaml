# PR-Agent automated code review
# Uses qodo-ai/pr-agent with DeepSeek API (OpenAI-compatible endpoint)
# Triggers on PR events + slash commands via issue_comment
#
# Sync with CONVENTIONS.md when conventions change
name: PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: PR Agent
        # Pin to v0.34 for stability — @main has hardcoded GPT-5 model names
        uses: docker://pragent/pr-agent:0.36.0-github_action
        env:
          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Model config via CONFIG.* format for PR-Agent v0.34
          CONFIG__MODEL: "deepseek/deepseek-chat"
          CONFIG__FALLBACK_MODELS: '["deepseek/deepseek-chat"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
