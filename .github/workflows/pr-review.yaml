# PR-Agent automated code review
# Uses DeepSeek via OpenAI-compatible API endpoint.
# Pin to v0.36 for stability — @main has hardcoded GPT-5 model names.
#
# Sync with CONVENTIONS.md when conventions change
name: PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: PR Agent
        # Pinned to the 0.36.0-github_action image digest (supply-chain hygiene:
        # a mutable tag receiving DEEPSEEK_API_KEY + GITHUB_TOKEN could be
        # repointed to an exfiltrating image). Re-pin when bumping the version.
        uses: docker://pragent/pr-agent@sha256:0e0ab10b296d0d04df2049c51a27c3fc29b1a791f939a532a14f2b775316f6c5 # 0.36.0-github_action
        env:
          # OpenAI-compatible endpoint pointing to DeepSeek
          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI__API_BASE: https://api.deepseek.com/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # Model name DeepSeek expects
          github_action_config.model: "openai/deepseek-v4-pro"
          CONFIG__MODEL: "openai/deepseek-v4-pro"
          CONFIG__FALLBACK_MODELS: '["openai/deepseek-v4-flash"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "128000"
