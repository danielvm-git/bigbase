# ============================================================================
# test-build-release.yml — CI pipeline for BigBase (v3 layout)
#
# Replaces ci-cd.yml + the release half of release-deploy.yml.
#
# Pipeline:
#   changes (path gate) → lint → test (SQLite + PostgreSQL) + toolchain-parity → verify → allure report
#                           ↘  test-ui (builds ui/dist once, shared) ↘ test-e2e (reuses ui/dist)
#                           ↘  dependency-review (PR only)
#                                                          ↘
#                                            (push to main only) release → build
#
# `changes` skips the whole chain for docs/spec-only edits (lint is gated on it;
# heavy jobs cascade-skip via needs: [lint]). It always runs & succeeds, so it is
# a safe single required check. The UI is built ONCE in test-ui and reused by
# test-e2e and build via the `ui-dist` artifact. `release` runs big-release (see
# .big-release.yml), which commits VERSION/CHANGELOG back to main and tags.
#
# The `build` job uploads a `bigbase-release` artifact (binary + deploy-meta.json).
# deploy.yml picks it up via a `workflow_run` trigger on this workflow's name —
# do not rename this workflow without updating deploy.yml's `workflows:` filter.
# ============================================================================
name: Test, Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '24'
  BINARY_PATH: 'bigbase-linux-amd64'

jobs:
  # ============================================================================
  # JOB: Changes — path gate. Decides whether a run touches buildable code.
  #
  # Docs/spec-only changes (**.md, specs/, agent config) skip the whole
  # lint→test→verify chain: `lint` is gated on `code == 'true'`, and every
  # heavy job needs [lint], so a skipped lint cascade-skips them. `verify`
  # (which uses always()) carries the same guard explicitly.
  #
  # This job ALWAYS runs and always succeeds, so it can safely be the single
  # required status check if branch protection is enabled on main (the other
  # job names stay stable regardless). It never leaves a PR waiting.
  # ============================================================================
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `code` is true when any changed file is NOT docs/spec/agent-config.
      #
      # dorny compiles each rule with picomatch and combines them with `.some()`
      # (the default quantifier). That means the exclusion MUST be expressed as a
      # SINGLE negated brace-alternation rule. Two traps this avoids:
      #   * multiple separate `!glob` rules OR together — a root README.md still
      #     matches `!specs/**` (it isn't under specs), so `code` would be true;
      #   * a trailing `**` rule matches every file, forcing `code` true always.
      # Both make docs-only changes run the full pipeline (skip never fires).
      # `predicate-quantifier: every` does NOT fix this — dorny's `every` requires
      # one file to match ALL patterns at once (impossible for disjoint path
      # globs) and also emits an "Unexpected input" warning (undeclared in v3.0.2
      # action.yml). Verified against dorny's filter.ts + picomatch for docs-only,
      # code-only, mixed, and dotfile-dir changes.
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - '!{**/*.md,*.md,specs/**,.agents/**,.cursor/**,.vscode/**}'

  # ============================================================================
  # JOB: Lint — golangci-lint (runs first for fast feedback)
  # ============================================================================
  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.0

      - name: golangci-lint
        run: golangci-lint run ./...

  # ============================================================================
  # JOB: Dependency Review — block PRs that introduce vulnerable or
  # license-incompatible dependencies (go.mod / package-lock.json deltas).
  # PR-only: the action diffs the PR base against the head. Depends on: changes.
  # ============================================================================
  dependency-review:
    name: Dependency Review
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure

  # ============================================================================
  # JOB: CI — Build, Vet, Test (SQLite) — depends on lint
  # ============================================================================
  test-sqlite:
    name: Test (sqlite)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BIGBASE_DB_DRIVER: sqlite
      BIGBASE_DB_DSN: ':memory:'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 120s

  # ============================================================================
  # JOB: CI — Build, Vet, Test (PostgreSQL) — depends on lint
  # ============================================================================
  test-postgres:
    name: Test (postgres)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bigbase_test
          POSTGRES_USER: bigbase
          POSTGRES_PASSWORD: bigbase_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BIGBASE_DB_DRIVER: postgres
      BIGBASE_DB_DSN: 'postgres://bigbase:bigbase_test_pw@localhost:5432/bigbase_test'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 120s

  # ==========================================================================
  # JOB: Test (UI / vitest) — runs the Admin UI unit suite under jsdom.
  # Previously the UI was only *built* in CI, never tested, so dependabot-class
  # breakage (jsdom/vitest/typescript) slipped through. Gates release.
  # Depends on: lint
  # ==========================================================================
  test-ui:
    name: Test (UI / vitest)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '${{ env.NODE_VERSION }}'

      # --legacy-peer-deps matches the Admin UI build step: typescript ~7 is
      # pinned while typescript-eslint@8 peer-caps typescript <6.1.0.
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: ESLint
        working-directory: ui
        run: npm run lint

      - name: TypeScript
        working-directory: ui
        run: npm run typecheck

      - name: Vitest (jsdom)
        working-directory: ui
        run: npm run test

      - name: Production build
        working-directory: ui
        run: npm run build

      # Build the embedded UI ONCE here and share it. test-e2e and build reuse
      # this artifact instead of re-running `npm run build` (2 fewer UI builds
      # per release run). The dist is source-derived and identical across those
      # jobs, so reuse is safe.
      - name: Upload built UI (ui/dist)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  # ============================================================================
  # JOB: Test (race) — exercise concurrency-sensitive Go components.
  # Depends on: lint
  # ============================================================================
  test-race:
    name: Test (race)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Race tests
        run: go test -race -timeout 300s ./components/deploy/... ./components/functions/... ./components/realtime/... ./components/monitoring/...

  # ============================================================================
  # JOB: Test (E2E) — browser and API flows against an isolated server.
  # Depends on: lint
  # ============================================================================
  test-e2e:
    name: Test (E2E)
    needs: [lint, test-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      # Reuse the UI built by test-ui instead of rebuilding (go:embed all:dist
      # in ui/embed.go embeds ui/dist into the `go run` server this job drives).
      - name: Download built UI (ui/dist)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-dist
          path: ui/dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npx playwright test tests/e2e --config=tests/e2e/playwright.config.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  # ==========================================================================
  # JOB: Verify — Go preflight (vet/test/gosec) + Gitleaks + Conventional
  #       Commits + No AI Attribution
  # Depends on: lint, test-sqlite, test-postgres
  # ==========================================================================
  verify:
    needs: [changes, lint, test-sqlite, test-postgres, test-race]
    if: always() && !cancelled() && needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'npm'

      # Lockfile-sync guard: `npm ci` fails fast if package.json and
      # package-lock.json have drifted (the @ctxo/plugin-api class of
      # release-job break). --ignore-scripts keeps it quick and side-effect free.
      - name: Lockfile sync guard (root)
        run: npm ci --ignore-scripts

      # Tests already ran in test-sqlite + test-postgres (both in this job's
      # needs), so verify does NOT re-run the suite — it runs vet + gosec only.
      - name: Go security scan (vet, gosec)
        run: npm run preflight:secscan

      - name: Build preflight
        run: npm run preflight:build

      # --- Gitleaks: install a pinned release binary and scan the checkout
      # (not git history — history predates a secret-scrubbing fix and would
      # perpetually fail; scanning the checked-out tree catches anything
      # newly introduced, which is what this gate is for). ---
      - name: Install gitleaks
        run: |
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks scan
        run: gitleaks detect --source . --no-git --no-banner --config .gitleaks.toml

      - name: Check conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|>>>>>>>)( |$)|^=======$' -- \
            ':!CHANGELOG.md' ':!specs/archive/**'; then
            echo "ERROR: unresolved merge-conflict marker found"
            exit 1
          fi

      # Required deploy env keys (deploy.yml REQUIRED_ENV_KEYS) must be
      # documented in .env.example — catches the BIGBASE_ROOT_ENCRYPTION_KEY
      # class of deploy-time config drift before release.
      - name: Check required env keys documented
        run: bash scripts/check-required-env-documented.sh

      - name: Check version drift (docs vs go.mod / .nvmrc)
        run: bash scripts/check-version-drift.sh

      - name: Check MCP adapter files are up-to-date
        run: bash scripts/gen-mcp-configs.sh --check

      - name: Check Conventional Commits
        run: bash scripts/check-conventional-commits.sh

      - name: Check no AI agent attribution
        run: bash scripts/check-no-ai-attribution.sh

  # ==========================================================================
  # JOB: Toolchain Parity — declared-toolchain contract (issue #179)
  #
  # Mirrors scripts/setup-vps.sh on the runner so "what CI has" == "what the
  # VPS has", then runs scripts/verify-toolchain.sh against toolchain.toml.
  # A required tool missing here would be missing on the VPS at deploy time —
  # caught pre-deploy instead of mid-build with a cryptic exit code. This is
  # the recurrence-prevention mechanism for the "missing tool on deploy host"
  # defect class (15 recurrences over 51 days).
  # Depends on: lint
  # ==========================================================================
  toolchain-parity:
    name: Toolchain parity (VPS mirror)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --- Provision the SAME tools setup-vps.sh installs on the VPS ---
      # Node 24 LTS (Vite 8 floor is Node >= 20.19; VPS standard is 24 LTS).
      - name: Setup Node ${{ env.NODE_VERSION }} (VPS parity)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '${{ env.NODE_VERSION }}'

      # pnpm + corepack (the VPS runs `corepack enable`; pnpm is a declared
      # required tool — BUG-2026-07-24 exit 127 was pnpm missing).
      - name: Enable corepack + pnpm (VPS parity)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      # Python 3 + pip (VPS apt-get installs python3 + python3-pip).
      - name: Setup Python (VPS parity)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      # uv — the PRIMARY Python install/start path. BUG-2026-07-12 was uv not
      # in PATH. The VPS installs uv via the official standalone installer.
      - name: Install uv (VPS parity)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # Go (engine.go AppGo; go.mod requires 1.26).
      - name: Setup Go ${{ env.GO_VERSION }} (VPS parity)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: false

      # ubuntu-latest ships git >= 2.30 already (declared floor).

      - name: Verify declared toolchain contract
        run: |
          # uv's installer puts the binary in ~/.local/bin; make it discoverable
          # (GH runners include ~/.local/bin, but be explicit for parity with the
          # VPS, where setup-vps.sh relies on the login shell PATH).
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash scripts/verify-toolchain.sh

  # ==========================================================================
  # JOB: Report — Generate Progress Dashboard (Allure + GitHub Pages)
  # Depends on: lint, test-sqlite, test-postgres, toolchain-parity, verify
  # ==========================================================================
  report:
    name: Generate Progress Dashboard
    needs: [lint, test-sqlite, test-postgres, test-race, test-ui, test-e2e, toolchain-parity, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync execution status from epic shards
        run: bash scripts/sync-status-from-epics.sh

      - name: Generate JUnit Progress XML
        run: python3 scripts/generate-allure-report.py

      - name: Get Allure history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Java (Allure commandline runtime)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: always()
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node (Allure commandline)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: always()
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Generate Allure Report
        if: always()
        env:
          ALLURE_RESULTS: allure-results
          ALLURE_REPORT: allure-report
          ALLURE_HISTORY: allure-history
          GH_PAGES: gh-pages
          KEEP_REPORTS: '20'
          REPORT_NAME: 'Allure Report with history'
        run: |
          set -e
          mkdir -p "$GH_PAGES" "$ALLURE_HISTORY"
          cp -r "$GH_PAGES"/. "$ALLURE_HISTORY"/

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"

          COUNT=$(ls "$ALLURE_HISTORY" | wc -l)
          echo "count folders in $ALLURE_HISTORY: $COUNT"
          KEEP_PLUS=$((KEEP_REPORTS + 1))
          if (( COUNT > KEEP_PLUS )); then
            ( cd "$ALLURE_HISTORY" \
              && rm -f index.html \
              && rm -rf last-history \
              && ls | sort -n | grep -v 'CNAME' | head -n -$((KEEP_PLUS - 2)) | xargs -r rm -rf )
          fi

          {
            printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; URL=%s/%s/index.html">\n' "$PAGES_URL" "$GITHUB_RUN_NUMBER"
            printf '<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">\n'
          } > "$ALLURE_HISTORY/index.html"

          cat > executor.json <<EOF
          {"name":"GitHub Actions","type":"github","reportName":"$REPORT_NAME",
          "url":"$PAGES_URL",
          "reportUrl":"$PAGES_URL/$GITHUB_RUN_NUMBER",
          "buildUrl":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
          "buildName":"GitHub Actions Run #$GITHUB_RUN_ID","buildOrder":"$GITHUB_RUN_NUMBER"}
          EOF
          mv executor.json "$ALLURE_RESULTS/"

          mkdir -p "$ALLURE_RESULTS/history"
          cp -r "$GH_PAGES/last-history/." "$ALLURE_RESULTS/history/" 2>/dev/null || true

          echo "generating report from $ALLURE_RESULTS to $ALLURE_REPORT ..."
          npx --yes allure-commandline@2.32.0 generate --clean "$ALLURE_RESULTS" -o "$ALLURE_REPORT"

          mkdir -p "$ALLURE_HISTORY/$GITHUB_RUN_NUMBER"
          cp -r "$ALLURE_REPORT/." "$ALLURE_HISTORY/$GITHUB_RUN_NUMBER/"
          mkdir -p "$ALLURE_HISTORY/last-history"
          cp -r "$ALLURE_REPORT/history/." "$ALLURE_HISTORY/last-history/"

      # Publish to gh-pages ONLY on push-to-main. Previously this committed to
      # gh-pages on every PR and push (hundreds of commits, constant rebases on
      # main). PRs now get the dashboard as a job summary instead of a commit.
      - name: Deploy report to GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Job summary (PRs — no gh-pages commit)
        if: always() && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          {
            echo "## Progress dashboard"
            echo ""
            echo "The Allure dashboard is published to GitHub Pages only on push to \`main\`."
            echo "This is a \`${{ github.event_name }}\` run, so the report was generated but not committed to \`gh-pages\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # JOB: Release — big-release (push to main only); see .big-release.yml
  # Depends on: verify
  # ==========================================================================
  release:
    name: Release
    needs: [verify, test-ui, test-race, test-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      new_release: ${{ steps.detect-release.outputs.new_release }}
      version: ${{ steps.detect-release.outputs.version }}
      sha: ${{ steps.detect-release.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Save pre-release HEAD
        id: pre-release
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Install the pinned big-release CLI (replaces semantic-release). The
      # published checksum is verified before use, mirroring the gitleaks
      # install in the verify job. big-release is a static Go binary — no
      # Node/npm needed in this job anymore.
      - name: Install big-release
        env:
          BIG_RELEASE_VERSION: '2.5.0'
          BIG_RELEASE_SHA256: '99fc0fc613938f926b5c744f93fffdd49e0c7a6238961b78593e9103eb221c7a'
        run: |
          curl -sSfLO "https://github.com/danielvm-git/big-release/releases/download/${BIG_RELEASE_VERSION}/big-release-linux-amd64"
          echo "${BIG_RELEASE_SHA256}  big-release-linux-amd64" | sha256sum -c -
          chmod +x big-release-linux-amd64
          sudo mv big-release-linux-amd64 /usr/local/bin/big-release
          big-release --version

      # big-release: analyze Conventional Commits → compute the next SemVer →
      # write VERSION, regenerate CHANGELOG.md, commit both back to main as
      # "chore(release): <version> [skip ci]", tag (v${version}), and publish
      # the GitHub Release. Config lives in .big-release.yml. The commit-back
      # moves HEAD, which the detect step below keys off (same mechanism the
      # previous semantic-release flow used).
      - name: Run big-release
        run: big-release release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: bigbase-release-bot
          GIT_AUTHOR_EMAIL: bigbase-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: bigbase-release-bot
          GIT_COMMITTER_EMAIL: bigbase-release-bot@users.noreply.github.com

      - name: Detect new release
        id: detect-release
        run: |
          NEW_HEAD=$(git rev-parse HEAD)
          echo "sha=${NEW_HEAD}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.pre-release.outputs.head }}" != "$NEW_HEAD" ]; then
            VERSION=$(cat VERSION)
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "New release detected: v${VERSION}"
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            echo "No new release"
          fi

  # ==========================================================================
  # JOB: Build — binary + Admin UI, produces the artifact deploy.yml consumes
  # Depends on: release (only runs when a new release was actually published)
  # ==========================================================================
  build:
    name: Build & Package
    needs: [release]
    if: needs.release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      # No `go test` here: the matrix (test-sqlite/test-postgres/test-race) and
      # verify already validated this commit. The release commit only adds a
      # [skip ci] VERSION/CHANGELOG bump — no Go source change to re-test.
      # No Node/UI build here either: reuse the ui/dist built once in test-ui
      # (go:embed all:dist embeds it into the binary below).
      - name: Download built UI (ui/dist)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-dist
          path: ui/dist

      - name: Build binary
        run: |
          BUILD_VERSION=${{ needs.release.outputs.version }}
          echo "Building version: ${BUILD_VERSION}"
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X github.com/danielvm/bigbase/kernel.Version=${BUILD_VERSION}" \
            -o ${{ env.BINARY_PATH }} .
          echo "Binary: $(file ${{ env.BINARY_PATH }})"
          echo "Size: $(ls -lh ${{ env.BINARY_PATH }} | awk '{print $5}')"

      - name: Smoke test binary
        run: |
          chmod +x ${{ env.BINARY_PATH }}
          VERSION_OUTPUT=$(./${{ env.BINARY_PATH }} version 2>&1)
          echo "Built: $VERSION_OUTPUT"

      - name: Write deploy-meta.json
        run: |
          cat > deploy-meta.json <<EOF
          {
            "sha": "${{ needs.release.outputs.sha }}",
            "ref": "${{ github.ref }}",
            "version": "${{ needs.release.outputs.version }}",
            "new_release": true,
            "app_type": "bigbase-server"
          }
          EOF
          cat deploy-meta.json

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bigbase-release
          path: |
            ${{ env.BINARY_PATH }}
            deploy-meta.json
          retention-days: 3
          compression-level: 0
