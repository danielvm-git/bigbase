# ============================================================================
# ci-cd.yml — Consolidated CI/CD Pipeline for BigBase
#
# Migrated from danielvm-git/.github ci-cd-go.yml template (v2.0.0)
# Adapted for BigBase: PostgreSQL matrix, Allure report, Go 1.26
#
# Pipeline:
#   ci (SQLite + PostgreSQL matrix) → lint → verify → allure report
#
# Note: Semantic release + SSH deploy stay in release-deploy.yml
# ============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

# ============================================================================
# JOB: CI — Build, Vet, Test (SQLite)
# ============================================================================
jobs:
  test-sqlite:
    name: Test (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BIGBASE_DB_DRIVER: sqlite
      BIGBASE_DB_DSN: ':memory:'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 120s

  # ============================================================================
  # JOB: CI — Build, Vet, Test (PostgreSQL)
  # ============================================================================
  test-postgres:
    name: Test (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bigbase_test
          POSTGRES_USER: bigbase
          POSTGRES_PASSWORD: bigbase_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BIGBASE_DB_DRIVER: postgres
      BIGBASE_DB_DSN: 'postgres://bigbase:bigbase_test_pw@localhost:5432/bigbase_test'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 120s

  # ==========================================================================
  # JOB: Lint — golangci-lint
  # ==========================================================================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.0

      - name: golangci-lint
        run: golangci-lint run ./...

  # ==========================================================================
  # JOB: Verify — Preflight + Conventional Commits + No AI Attribution
  # ==========================================================================
  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preflight
        run: |
          if [ -f scripts/preflight.sh ]; then
            bash scripts/preflight.sh
          elif [ -f Makefile ] && grep -q '^preflight:' Makefile; then
            make preflight
          else
            echo "WARN: No preflight script found — add scripts/preflight.sh"
          fi

      - name: Check Conventional Commits
        run: |
          NON_CC=$(git log origin/main..HEAD --no-merges --format="%s" | grep -v -c -E "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: " || true)
          if [ "$NON_CC" -gt 0 ]; then
            echo "FAIL: $NON_CC commits do not follow Conventional Commits"
            git log origin/main..HEAD --no-merges --format="%s" | grep -v -E "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: "
            exit 1
          fi
          echo "PASS: All commits follow Conventional Commits"

      - name: Check no AI agent attribution
        run: |
          NON_CURSOR=$(git log origin/main..HEAD --format="%B" | grep -iE '^co[- ]authored[- ]by:' | grep -v -i 'cursor' | wc -l | tr -d ' ')
          if [ "$NON_CURSOR" -gt 0 ]; then
            echo "FAIL: Non-Cursor Co-authored-by: footer found — blocked by CONVENTIONS.md"
            git log origin/main..HEAD --format="%B" | grep -iE '^co[- ]authored[- ]by:' | grep -v -i 'cursor'
            exit 1
          fi
          echo "PASS: No AI agent attribution"

  # ==========================================================================
  # JOB: Report — Generate Progress Dashboard (Allure + GitHub Pages)
  # ==========================================================================
  report:
    name: Generate Progress Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-sqlite, test-postgres]
    if: always()
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync execution status from epic shards
        run: bash scripts/sync-status-from-epics.sh

      - name: Generate JUnit Progress XML
        run: python3 scripts/generate-allure-report.py

      - name: Get Allure history
        uses: actions/checkout@v7
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Java (Allure commandline runtime)
        uses: actions/setup-java@v4
        if: always()
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node (Allure commandline)
        uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '20'

      - name: Generate Allure Report
        if: always()
        env:
          ALLURE_RESULTS: allure-results
          ALLURE_REPORT: allure-report
          ALLURE_HISTORY: allure-history
          GH_PAGES: gh-pages
          KEEP_REPORTS: '20'
          REPORT_NAME: 'Allure Report with history'
        run: |
          set -e
          mkdir -p "$GH_PAGES" "$ALLURE_HISTORY"
          cp -r "$GH_PAGES"/. "$ALLURE_HISTORY"/

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"

          COUNT=$(ls "$ALLURE_HISTORY" | wc -l)
          echo "count folders in $ALLURE_HISTORY: $COUNT"
          KEEP_PLUS=$((KEEP_REPORTS + 1))
          if (( COUNT > KEEP_PLUS )); then
            ( cd "$ALLURE_HISTORY" \
              && rm -f index.html \
              && rm -rf last-history \
              && ls | sort -n | grep -v 'CNAME' | head -n -$((KEEP_PLUS - 2)) | xargs -r rm -rf )
          fi

          {
            printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; URL=%s/%s/index.html">\n' "$PAGES_URL" "$GITHUB_RUN_NUMBER"
            printf '<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">\n'
          } > "$ALLURE_HISTORY/index.html"

          cat > executor.json <<EOF
          {"name":"GitHub Actions","type":"github","reportName":"$REPORT_NAME",
          "url":"$PAGES_URL",
          "reportUrl":"$PAGES_URL/$GITHUB_RUN_NUMBER",
          "buildUrl":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
          "buildName":"GitHub Actions Run #$GITHUB_RUN_ID","buildOrder":"$GITHUB_RUN_NUMBER"}
          EOF
          mv executor.json "$ALLURE_RESULTS/"

          mkdir -p "$ALLURE_RESULTS/history"
          cp -r "$GH_PAGES/last-history/." "$ALLURE_RESULTS/history/" 2>/dev/null || true

          echo "generating report from $ALLURE_RESULTS to $ALLURE_REPORT ..."
          npx --yes allure-commandline@2.32.0 generate --clean "$ALLURE_RESULTS" -o "$ALLURE_REPORT"

          mkdir -p "$ALLURE_HISTORY/$GITHUB_RUN_NUMBER"
          cp -r "$ALLURE_REPORT/." "$ALLURE_HISTORY/$GITHUB_RUN_NUMBER/"
          mkdir -p "$ALLURE_HISTORY/last-history"
          cp -r "$ALLURE_REPORT/history/." "$ALLURE_HISTORY/last-history/"

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
