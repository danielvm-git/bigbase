# ============================================================================
# release-deploy.yml — Release + Deploy pipeline for BigBase
#
# Merged workflow to fix GITHUB_TOKEN event suppression: semantic-release
# creates the release, and deploy proceeds in the same workflow if a new
# version was published. This avoids the issue where GITHUB_TOKEN-triggered
# releases don't fire downstream workflow events.
#
# Triggers:
#   - Push to main → semantic-release analyzes commits, publishes if warranted
#   - Manual workflow_dispatch (for re-deploying an existing tag)
#
# Pipeline:
#   0. Semantic Release (determine version, publish release)
#   1. Test & Build (Go + embedded Admin UI)
#   2. Deploy to Contabo VPS via SSH
#   3. Automatic rollback on health check failure
# ============================================================================
name: Release & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag, e.g. v1.0.0)'
        required: true
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  BINARY_NAME: 'bigbase'
  BINARY_PATH: 'bigbase-linux-amd64'
  VPS_BIN_DIR: '/opt/bigbase/bin'
  VPS_RELEASES_DIR: '/opt/bigbase/releases'
  VPS_BACKUPS_DIR: '/opt/bigbase/backups'
  VPS_DATA_DIR: '/opt/bigbase/data'
  VPS_ENV_FILE: '/opt/bigbase/.env'
  HEALTH_URL: 'http://localhost:8080/api/monitoring/health'
  MAX_BACKUPS_TO_KEEP: 7

jobs:
  # ==========================================================================
  # JOB: Release + Deploy (single job chain)
  # ==========================================================================
  release-and-deploy:
    name: Release & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      new_release: ${{ steps.detect-release.outputs.new_release }}
      version: ${{ steps.detect-release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: true

      # --- Semantic Release (only on push events, not workflow_dispatch) ---
      - name: Setup Node
        if: github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'npm'

      - name: Save pre-release HEAD
        id: pre-release
        if: github.event_name == 'push'
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: github.event_name == 'push'
        run: npm ci

      - name: Semantic Release
        if: github.event_name == 'push'
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Detect if a release was created ---
      - name: Detect new release
        id: detect-release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual deploy — always release
            VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0-dev")
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Manual deploy — version ${VERSION}"
          else
            # Push event — check if sem-rel created a new commit
            NEW_HEAD=$(git rev-parse HEAD)
            if [ "${{ steps.pre-release.outputs.head }}" != "$NEW_HEAD" ]; then
              VERSION=$(cat VERSION)
              echo "new_release=true" >> "$GITHUB_OUTPUT"
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "New release detected: v${VERSION}"
            else
              echo "new_release=false" >> "$GITHUB_OUTPUT"
              echo "No new release"
            fi
          fi

      # --- Setup Go ---
      - name: Setup Go ${{ env.GO_VERSION }}
        if: steps.detect-release.outputs.new_release == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      # --- Run Go unit tests ---
      - name: Run tests
        if: steps.detect-release.outputs.new_release == 'true'
        run: go test ./... -count=1

      # --- Build Admin UI (embedded in binary) ---
      - name: Build Admin UI
        if: steps.detect-release.outputs.new_release == 'true'
        working-directory: ui
        run: |
          npm ci --prefer-offline
          npm run build
          echo "Admin UI built: $(ls -lh dist/ | wc -l) files"

      # --- Build Go binary for linux/amd64 ---
      - name: Build binary
        if: steps.detect-release.outputs.new_release == 'true'
        run: |
          BUILD_VERSION=${{ steps.detect-release.outputs.version }}
          echo "Building version: ${BUILD_VERSION}"
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X github.com/danielvm/bigbase/kernel.Version=${BUILD_VERSION}" \
            -o ${{ env.BINARY_PATH }} .
          echo "Binary: $(file ${{ env.BINARY_PATH }})"
          echo "Size: $(ls -lh ${{ env.BINARY_PATH }} | awk '{print $5}')"

      - name: Smoke test binary
        if: steps.detect-release.outputs.new_release == 'true'
        run: |
          chmod +x ${{ env.BINARY_PATH }}
          VERSION_OUTPUT=$(./${{ env.BINARY_PATH }} version 2>&1)
          echo "Built: $VERSION_OUTPUT"

      # --- Upload binary as artifact ---
      - name: Upload binary artifact
        if: steps.detect-release.outputs.new_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bigbase-linux-amd64
          path: ${{ env.BINARY_PATH }}
          retention-days: 3
          compression-level: 0

      # ======================================================================
      # Deploy to Contabo VPS
      # ======================================================================
      - name: Download built binary
        if: steps.detect-release.outputs.new_release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: bigbase-linux-amd64

      - name: Make binary executable
        if: steps.detect-release.outputs.new_release == 'true'
        run: chmod +x ${{ env.BINARY_PATH }}

      # --- Upload binary via SCP ---
      - name: Upload binary to VPS
        if: steps.detect-release.outputs.new_release == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_SSH_PORT || 22 }}
          source: ${{ env.BINARY_PATH }}
          target: /tmp/
          strip_components: 0

      # --- Deploy via SSH ---
      - name: Deploy binary and restart service
        if: steps.detect-release.outputs.new_release == 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          BINARY_PATH: ${{ env.BINARY_PATH }}
          VPS_BIN_DIR: ${{ env.VPS_BIN_DIR }}
          VPS_RELEASES_DIR: ${{ env.VPS_RELEASES_DIR }}
          VPS_BACKUPS_DIR: ${{ env.VPS_BACKUPS_DIR }}
          VPS_DATA_DIR: ${{ env.VPS_DATA_DIR }}
          VPS_ENV_FILE: ${{ env.VPS_ENV_FILE }}
          HEALTH_URL: ${{ env.HEALTH_URL }}
          MAX_BACKUPS: ${{ env.MAX_BACKUPS_TO_KEEP }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_SSH_PORT || 22 }}
          envs: >-
            BINARY_PATH,VPS_BIN_DIR,VPS_RELEASES_DIR,
            VPS_BACKUPS_DIR,VPS_DATA_DIR,VPS_ENV_FILE,
            HEALTH_URL,MAX_BACKUPS,
            GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET
          # -------- Script executed on VPS --------
          script: |
            set -euo pipefail

            # ----------------------------------------------------------------
            # Phase 1: Verify preconditions
            # ----------------------------------------------------------------
            echo "=== Phase 1: Preconditions ==="

            if [ ! -d "${VPS_BIN_DIR}" ]; then
              echo "ERROR: ${VPS_BIN_DIR} does not exist."
              echo "Run scripts/setup-vps.sh on this server first."
              exit 1
            fi

            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            echo "Deploy timestamp: ${TIMESTAMP}"

            # ----------------------------------------------------------------
            # Phase 2: Backup current binary
            # ----------------------------------------------------------------
            echo "=== Phase 2: Backup current binary ==="

            if [ -f "${VPS_BIN_DIR}/bigbase" ]; then
              mkdir -p "${VPS_RELEASES_DIR}/${TIMESTAMP}"
              cp "${VPS_BIN_DIR}/bigbase" "${VPS_RELEASES_DIR}/${TIMESTAMP}/bigbase"
              rm -rf "${VPS_RELEASES_DIR}/previous"
              cp -r "${VPS_RELEASES_DIR}/${TIMESTAMP}" "${VPS_RELEASES_DIR}/previous"
              echo "  Backed up current binary to releases/${TIMESTAMP}/"
            else
              echo "  No previous binary — first deploy"
            fi

            # ----------------------------------------------------------------
            # Phase 3: Backup database
            # ----------------------------------------------------------------
            echo "=== Phase 3: Backup database ==="

            if [ -f "${VPS_DATA_DIR}/bigbase.db" ]; then
              cp "${VPS_DATA_DIR}/bigbase.db" "${VPS_BACKUPS_DIR}/bigbase-${TIMESTAMP}.db"
              echo "  Database backed up to backups/bigbase-${TIMESTAMP}.db"
              ls -1t "${VPS_BACKUPS_DIR}"/bigbase-*.db 2>/dev/null \
                | tail -n +$((MAX_BACKUPS + 1)) \
                | xargs -r rm
              echo "  Keeping last ${MAX_BACKUPS} database backups"
            else
              echo "  No database to backup — initial deploy"
            fi

            # ----------------------------------------------------------------
            # Phase 4: Write OAuth env file if secrets provided
            # ----------------------------------------------------------------
            echo "=== Phase 4: Configure environment ==="

            if [ -n "${GOOGLE_CLIENT_ID:-}" ] && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              cat > "${VPS_ENV_FILE}" << EOENV
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            EOENV
              chmod 600 "${VPS_ENV_FILE}"
              chown bigbase:bigbase "${VPS_ENV_FILE}" 2>/dev/null || true
              echo "  Environment file written: ${VPS_ENV_FILE}"
            else
              echo "  No Google OAuth credentials — deploying without social login"
              rm -f "${VPS_ENV_FILE}" 2>/dev/null || true
            fi

            # ----------------------------------------------------------------
            # Phase 5: Deploy new binary
            # ----------------------------------------------------------------
            echo "=== Phase 5: Deploy new binary ==="

            if [ -f "/tmp/${BINARY_PATH}" ]; then
              mv "/tmp/${BINARY_PATH}" "${VPS_BIN_DIR}/bigbase"
            else
              echo "ERROR: Binary not found at /tmp/${BINARY_PATH}"
              ls -la /tmp/bigbase* 2>/dev/null || true
              exit 1
            fi

            chmod +x "${VPS_BIN_DIR}/bigbase"
            chown bigbase:bigbase "${VPS_BIN_DIR}/bigbase" 2>/dev/null || true
            echo "  Binary deployed to ${VPS_BIN_DIR}/bigbase"
            echo "  Version: $(${VPS_BIN_DIR}/bigbase version 2>&1)"

            # ----------------------------------------------------------------
            # Phase 6: Restart service
            # ----------------------------------------------------------------
            echo "=== Phase 6: Restart service ==="

            systemctl daemon-reload 2>/dev/null || true
            systemctl restart bigbase
            echo "  Service restarted"

            # ----------------------------------------------------------------
            # Phase 7: Health check with retry
            # ----------------------------------------------------------------
            echo "=== Phase 7: Health check ==="

            HEALTH_PASS=false
            for i in 1 2 3 4 5; do
              sleep 3
              echo "  Attempt ${i}/5..."
              if curl -sf "${HEALTH_URL}" > /dev/null 2>&1; then
                HEALTH_PASS=true
                echo "  HEALTHY — BigBase is serving requests"
                break
              fi
            done

            if [ "${HEALTH_PASS}" = false ]; then
              echo ""
              echo "=== HEALTH CHECK FAILED! Rolling back... ==="
              journalctl -u bigbase --no-pager -n 50 || true

              if [ -f "${VPS_RELEASES_DIR}/previous/bigbase" ]; then
                cp "${VPS_RELEASES_DIR}/previous/bigbase" "${VPS_BIN_DIR}/bigbase"
                chmod +x "${VPS_BIN_DIR}/bigbase"
                chown bigbase:bigbase "${VPS_BIN_DIR}/bigbase" 2>/dev/null || true
                systemctl restart bigbase
                echo "  Rolled back to previous release"
                sleep 3
                if curl -sf "${HEALTH_URL}" > /dev/null 2>&1; then
                  echo "  Rollback successful — previous release is running"
                else
                  echo "  CRITICAL: Rollback also failed. Manual intervention required!"
                fi
              else
                echo "  CRITICAL: No previous release to rollback to. Manual intervention required!"
              fi
              exit 1
            fi

            # ----------------------------------------------------------------
            # Phase 8: Cleanup old releases
            # ----------------------------------------------------------------
            echo "=== Phase 8: Cleanup ==="

            ls -1t "${VPS_RELEASES_DIR}" \
              | grep -E '^[0-9]{8}-[0-9]{6}$' \
              | tail -n +6 \
              | while read -r old; do
                  rm -rf "${VPS_RELEASES_DIR}/${old}"
                  echo "  Removed old release: ${old}"
                done

            echo ""
            echo "=== DEPLOY COMPLETE ==="
            echo "Timestamp: ${TIMESTAMP}"
            echo "Binary:    $(ls -lh ${VPS_BIN_DIR}/bigbase | awk '{print $5}')"
            echo "Database:  $(ls -lh ${VPS_DATA_DIR}/bigbase.db 2>/dev/null | awk '{print $5}')"

      # --- Deployment verification ---
      - name: Deployment verification
        if: success() && steps.detect-release.outputs.new_release == 'true'
        run: |
          echo "✅ Deploy finished successfully"
          echo "   Server: ${{ secrets.CONTABO_HOST }}"
          echo "   Time: $(date -u)"

  # ==========================================================================
  # Notify on failure
  # ==========================================================================
  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [release-and-deploy]
    if: failure() && github.event_name != 'workflow_dispatch'

    steps:
      - name: Build failure summary
        run: |
          echo "❌ BigBase release/deploy FAILED"
          echo "   Repository: ${{ github.repository }}"
          echo "   Commit: ${{ github.sha }}"
          echo "   Branch: ${{ github.ref_name }}"
          echo "   Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
