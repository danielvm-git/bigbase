# ============================================================================
# release.yml — Automated semantic-release pipeline
#
# Runs on every push to main. semantic-release analyzes conventional commits
# and, if a release is warranted:
#   1. Determines the next version (major/minor/patch)
#   2. Writes the version to the VERSION file
#   3. Generates/updates CHANGELOG.md
#   4. Creates a git tag (e.g., v1.2.3)
#   5. Commits VERSION + CHANGELOG.md + package.json back to main
#   6. Creates a GitHub Release with release notes
#
# The resulting GitHub Release triggers the deploy.yml workflow.
# ============================================================================
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
