# ============================================================================
# ci.yml — Continuous Integration for BigBase
#
# Runs on every pull request and push to main.
# Tests both SQLite and PostgreSQL drivers via a matrix strategy.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  test:
    name: Test (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16
        # Only start the container for the postgres matrix leg.
        # GitHub Actions doesn't support conditional services, so we start it
        # for both but only connect from the postgres leg (sqlite leg ignores it).
        env:
          POSTGRES_DB: bigbase_test
          POSTGRES_USER: bigbase
          POSTGRES_PASSWORD: bigbase_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BIGBASE_DB_DRIVER: ${{ matrix.db }}
      BIGBASE_DB_DSN: ${{ matrix.db == 'postgres' && 'postgres://bigbase:bigbase_test_pw@localhost:5432/bigbase_test' || ':memory:' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./... -count=1 -timeout 120s

  report:
    name: Generate Progress Dashboard
    runs-on: ubuntu-latest
    needs: test
    if: always()
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync execution status from epic shards
        run: bash scripts/sync-status-from-epics.sh

      - name: Generate JUnit Progress XML
        run: python3 scripts/generate-allure-report.py

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        # pinned to v1.7 — SHA: e3e158032c1140676ea295a073942850d68bae29
        uses: simple-elf/allure-report-action@e3e158032c1140676ea295a073942850d68bae29
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy report to GitHub Pages
        if: always()
        # pinned to v4.0.0 — SHA: 47f197a2200bb9de68ba5f48fad1c088eb1c4a32
        uses: peaceiris/actions-gh-pages@47f197a2200bb9de68ba5f48fad1c088eb1c4a32
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
