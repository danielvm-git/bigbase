version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-root:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-ui-react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
      npm-ui-eslint:
        patterns:
          - "eslint*"
          - "@typescript-eslint*"
          - "@eslint*"
      npm-ui-vite:
        patterns:
          - "vite*"
          - "vitest*"
          - "@vitejs*"
      npm-ui-types:
        patterns:
          - "@types/*"
      npm-ui-misc:
        patterns:
          - "*"
        exclude-patterns:
          - "react*"
          - "@types/react*"
          - "eslint*"
          - "@typescript-eslint*"
          - "@eslint*"
          - "vite*"
          - "vitest*"
          - "@vitejs*"
          - "@types/*"
    # Hold typescript-eslint at 8.66.x — 8.67.0 drags in the new
    # @typescript/typescript-*@7.0.2 platform packages and its runtime check
    # then fails with "typescript-eslint does not support TS 7.0" against the
    # pinned TS ~6.0.3 (see ui/package.json). Remove this ignore once a
    # typescript-eslint release supports the TS 7.x platform layout.
    ignore:
      - dependency-name: "typescript-eslint"
        versions:
          - ">=8.67.0"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
