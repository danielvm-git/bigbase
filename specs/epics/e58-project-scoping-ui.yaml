type: epic-shard
context: domain
id: e58
title: "Project Scoping — Admin UI"
wsjf: 5.0
wsjf_rationale: "BV=8(high: project-scoped UI is the user-facing deliverable of the entire project scoping initiative) TC=5(blocks all downstream UI work that needs project context) RR=7(transforms flat admin into navigable workspace) / JS=3(~2 days across 1 story, 3 BCPs)"
status: planned
tier: 1
depends_on: [e56, e57]
covers:
  - ui/
stories:
  - id: e58s01
    title: "Admin UI — project-scoped routing, selector, sidebar, dashboard, settings"
    status: planned
    bcps: 3
    tasks:
      - desc: "URL restructure — /project/:projectId/... with backward compat"
        notes: |
          New routes (project-scoped):
            /project/:projectId → dashboard
            /project/:projectId/sql/:branch? → SQL editor
            /project/:projectId/site → site detail + deployments
            /project/:projectId/site/domains → custom domains
            /project/:projectId/site/env-vars → env vars
            /project/:projectId/auth → auth settings
            /project/:projectId/functions → functions
            /project/:projectId/storage → storage
            /project/:projectId/branches → DB branches
            /project/:projectId/settings → project settings
          Legacy flat routes (/data, /sql, /deploy) redirect to /project/:lastProjectId/... using localStorage.
          When no project selected: show project picker + global-only pages (users, monitoring, system health).
        verify: "cd ui && npm run build"
      - desc: "Project selector — header dropdown + useProjectScope hook"
        notes: |
          Header component: project selector dropdown (left of breadcrumb bar).
          Lists all projects for current org. "Create new project" option at bottom.
          Selecting a project updates URL to /project/:projectId/...
          Branch selector: dropdown listing branches of current project (only visible on SQL/branches pages).
          React hook: useProjectScope() → { project, projectId, branch, setProject, setBranch, projects, branches }.
        verify: "cd ui && npm run build"
      - desc: "Two-zone sidebar — project zone vs global zone"
        notes: |
          Project Zone (visible when project selected, subtle background tint):
            - Dashboard, SQL Editor, Site (deployments, logs, env vars, domains)
            - Functions, Storage, Auth, Branches, Settings
          Global Zone (always visible, below divider):
            - Users, System Monitoring, Platform Settings
          Visual distinction: Project Zone has accent border or tint.
        verify: "cd ui && npm run build"
      - desc: "Project Dashboard page — connection string, stats, quick actions"
        notes: |
          /project/:projectId:
            - Connection string card (copyable, format toggle: psql / URI / env var)
            - Quick stats: tables count, rows, storage used
            - Recent deployments list
            - Branch cards: name, status, last active, size
            - "Open SQL Editor" CTA
        verify: "cd ui && npm run build"
      - desc: "Project Settings page — name, DB config, Danger Zone"
        notes: |
          /project/:projectId/settings:
            - General: project name, description, delete project
            - Database: connection pool config
            - Danger Zone: delete project (confirm with name input)
        verify: "cd ui && npm run build"
      - desc: "Backward compatibility — legacy routes still work"
        notes: |
          All existing routes (/deploy, /data, /sql, /functions, /storage, /users, /forge, /cici, /messaging, /monitoring, /realtime, /settings) remain functional.
          When accessed without project context: redirect to project picker.
          API backward compat: all existing API endpoints accept project_id as optional query parameter.
          When project_id is absent, operate in legacy global mode.
        verify: "cd ui && npm run build && go test ./components/deploy/ -run TestDeploy -v"
