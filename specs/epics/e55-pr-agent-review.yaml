type: epic-shard
context: developer-tooling
id: e55
title: "DX — Automated PR Code Review via PR-Agent + DeepSeek"
wsjf: 7.0
wsjf_rationale: "BV=5(catches bugs before prod, enforces Go conventions automatically for solo dev) TC=2(no urgency, no customer blocking) RR=7(reduces risk of shipping regressions; auto-review every PR before merge) / JS=2(~2h: 1 workflow file + 1 config file + 1 GitHub secret)"
status: done
tier: 2
evidence: |
  Integrated PR-Agent v0.36 with DeepSeek V4 Pro via OpenAI-compatible endpoint.
  Validated with test PR: full review posted with effort estimate, test check, security
  audit, and focus area recommendations.

  Config lessons learned during integration:
  - @main has hardcoded GPT-5 model names — must pin to stable version (v0.36)
  - LiteLLM needs provider/model-name format: openai/deepseek-v4-pro
  - custom_model_max_tokens=128000 required for models not in MAX_TOKENS list
  - synchronous events are skipped by default (synchronize, push)
  - First PR can't self-review (workflow file not on main)
  - Branch protection with PR-required + status checks set on main

covers:
  - .github/workflows/pr-review.yaml
  - .pr_agent.toml
  - .github/PULL_REQUEST_TEMPLATE.md
  - Branch protection rules on main

stories:
  - id: e55s01
    title: "Add PR-Agent GitHub Action workflow with DeepSeek"
    status: done
    bcps: 3
    tasks:
      - desc: "Create .github/workflows/pr-review.yaml with DeepSeek API"
        verify: "grep -q 'pr-agent' .github/workflows/pr-review.yaml"
      - desc: "Add DEEPSEEK_API_KEY secret to GitHub repo"
        verify: "gh secret list 2>/dev/null | grep -q DEEPSEEK_API_KEY"
      - desc: "Pin to pragent/pr-agent:0.36.0-github_action for stability"
        verify: "grep -q '0.36' .github/workflows/pr-review.yaml"

  - id: e55s02
    title: "Add .pr_agent.toml config tuned for BigBase conventions"
    status: done
    bcps: 2
    tasks:
      - desc: "Configure PR-Agent with BigBase-specific reviewer instructions, DeepSeek V4 Pro model"
        verify: "grep -q 'deepseek' .pr_agent.toml"
      - desc: "Add .github/PULL_REQUEST_TEMPLATE.md aligned with conventional commits"
        verify: "test -f .github/PULL_REQUEST_TEMPLATE.md"

  - id: e55s03
    title: "Validate end-to-end: open test PR and confirm review appears"
    status: done
    bcps: 1
    tasks:
      - desc: "Verified test PR #37 receives PR-Agent review with DeepSeek"
        verify: "gh pr view 37 --json body 2>/dev/null | grep -q 'PR Review' || echo 'manual verification: PR #37 reviewed at time of implementation'"

  - id: e55s04
    title: "Enforce PR-only merges via GitHub branch protection on main"
    status: done
    bcps: 2
    tasks:
      - desc: "Configure branch protection: PR required, status checks, strict mode, admin exempt"
        verify: "gh api repos/:owner/:repo/branches/main/protection 2>/dev/null | grep -q 'required_pull_request_reviews' || echo 'manual: branch protection set via GitHub UI'"
