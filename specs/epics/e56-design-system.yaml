type: epic-shard
context: domain
id: e56
title: "UI Refactor — Console Redesign & Component Library (Evolved v2)"
wsjf: 6.5
wsjf_rationale: "BV=9(high: comprehensive component library unblocks ALL downstream UI epics — e60-e65) TC=7(critical path blocker; enables parallel work on e39-e52, e56-e57 immediately after completion) RR=9(foundational — every UI in BigBase uses these components) / JS=7(~7 days across 7 stories, 26 BCPs)"
status: planned
tier: 1
depends_on: []
blocks: [e58', e59, e60, e61, e62, e63, e64, e65]
covers:
  - ui/
notes: |
  **Purpose:** Establish a comprehensive, production-grade component library and design system that serves as the single source of truth for ALL upcoming UI epics (e60-e65). This epic implements the BigBase Console - Evolved v2 design system, including:
  - Design tokens (colors, spacing, typography, shadows, animations)
  - Core components (Button, Input, Card, Badge, Header, Sidebar, Modal, Grid)
  - Extended form & complex components (Table, Select, Textarea, Checkbox, Radio, DatePicker, ConfirmDialog)
  - Data visualization & editor components (Charts via Recharts, Code Editor via Monaco, Terminal/LogViewer, Tree/Outline)
  - Page templates and integration patterns
  - Responsive design and accessibility (WCAG 2.1 AA)
  - Storybook integration for design documentation and development

  **Rationale:** Rather than having e39-e52, e56-e57 each build ad-hoc UI and duplicate components, all epics consume a single, well-documented design system. This:
  - Eliminates component duplication across epics (Table, Select, etc.)
  - Ensures visual consistency across all features
  - Accelerates delivery of UI work by 2-3 weeks (parallel development possible)
  - Provides a complete component library ready for future features
  - Enables Storybook-driven component development and testing

  **Design Source:** BigBase Console - Evolved v2 (imported from claude.ai/design prototype project, includes component stubs and specs for tokens, accessibility, responsive behavior, and component states). React stubs already in prototype for quick reference.

  **Blocking:** e56s05, e59s01-s04, e39s03, e60, e61, e62, e63, e64, e65 all depend on this epic's core stories (s02-s07).

stories:
  - id: e56s01
    title: "Design Tokens & Theme System"
    status: planned
    bcps: 3
    tasks:
      - desc: "Export design tokens from Evolved v2 spec — colors, spacing, typography, shadows"
        notes: |
          Create tokens.ts/tokens.js at ui/src/tokens/ with:
            - Color palette: brand (primary), neutral (0-900), semantic (success, warning, error)
            - Spacing: 2px, 4px, 8px, 12px, 16px, 24px, 32px, 48px, 64px (8px scale)
            - Typography: Inter (400, 450, 500, 600, 700), Fira Code for monospace
            - Font sizes: xs (12px), sm (14px), base (16px), lg (18px), xl (20px), 2xl (24px)
            - Shadows: sm, md, lg, xl (CSS custom properties)
            - Border radius: sm (4px), md (8px), lg (12px), full (9999px)
            - Z-index scale: 0, 10, 20, 30, 40, 50 (for modals, dropdowns, etc.)
          Export as ES module: `export const tokens = { colors: {...}, spacing: {...}, ...}`
          Also export as CSS custom properties for HTML/CSS-only components.
        verify: "cd ui && npm run build && grep -c 'export const tokens' src/tokens.ts"
      - desc: "Build ThemeContext + ThemeProvider React component"
        notes: |
          Create ThemeContext.tsx at ui/src/context/ThemeContext.tsx:
            - useTheme() hook → { theme: light | dark, toggleTheme }
            - ThemeProvider component wraps root App
            - Persist theme preference to localStorage (key: 'bigbase-theme')
            - Apply theme class to <html> element (class="theme-light" or "theme-dark")
            - Token values adjust via CSS custom properties (--neutral-0, --brand-500, etc.)
          Supports light and dark color schemes via tokens variation.
        verify: "cd ui && npm run build && grep -c 'useTheme' src/context/ThemeContext.tsx"
      - desc: "Storybook setup for token preview + theme switcher"
        notes: |
          Create stories/Tokens.stories.tsx:
            - Display all token categories: colors (grid with swatches), spacing (scale), typography (samples)
            - Storybook controls to toggle theme (light/dark)
            - Interactive preview: click color swatch to copy hex/RGB value
            - Document semantic token usage (e.g., --error used for error states)
          Storybook config: .storybook/main.ts includes theme addon.
        verify: "cd ui && npm run storybook:build"

  - id: e56s02
    title: "Core Component Library — Button, Input, Card, Badge"
    status: planned
    bcps: 4
    tasks:
      - desc: "Button component — variants, sizes, states, icons"
        notes: |
          Create components/Button.tsx:
            - Variants: primary, secondary, ghost, danger
            - Sizes: sm (32px), md (40px), lg (48px)
            - States: default, hover, active, disabled, loading
            - Icon support: leading/trailing icons, icon-only buttons
            - Props: variant, size, disabled, loading, icon, onClick, className
            - Accessibility: ARIA labels, keyboard nav (Enter, Space), focus ring
            - Stories: components/Button.stories.tsx with all variant/size/state combos
          Styling: Tailwind or CSS Modules using design tokens.
        verify: "cd ui && npm run build && npm run test -- Button.test.tsx"
      - desc: "Input component — text, email, password, states"
        notes: |
          Create components/Input.tsx:
            - Types: text, email, password, number, search
            - States: default, focus, disabled, error, success
            - Props: label, placeholder, error, value, onChange, disabled, icon
            - Accessibility: <label> htmlFor, aria-describedby for error text
            - Error display: optional error text below input (--error color)
            - Success indicator: optional checkmark icon for validation
            - Stories: components/Input.stories.tsx
          Styling aligned to tokens (neutral-100 border, brand-500 focus ring).
        verify: "cd ui && npm run build && npm run test -- Input.test.tsx"
      - desc: "Card component — container, header, footer, interactive"
        notes: |
          Create components/Card.tsx:
            - Props: children, className, clickable, onClick
            - Subcomponents: Card.Header, Card.Body, Card.Footer (optional)
            - Styling: neutral-25 background, neutral-200 border, shadow-md
            - Hover state when clickable (shadow-lg, cursor-pointer)
            - Padding: 16px (md size), 24px (lg size)
            - Stories: components/Card.stories.tsx
          Example: <Card><Card.Header>Title</Card.Header><Card.Body>Content</Card.Body></Card>
        verify: "cd ui && npm run build && npm run test -- Card.test.tsx"
      - desc: "Badge component — status, color, size"
        notes: |
          Create components/Badge.tsx:
            - Variants: default (neutral), success, warning, error, info
            - Sizes: sm, md
            - Props: variant, children, className
            - Styling: colored background (e.g., success-bg for success variant), semantic foreground text
            - Rounded: border-radius 4px (sm) or 6px (md)
            - Stories: components/Badge.stories.tsx
          Use in deployment status (success badge for live, warning for rollback, error for failed).
        verify: "cd ui && npm run build && npm run test -- Badge.test.tsx"

  - id: e56s03
    title: "Layout Components — Header, Sidebar, Navigation"
    status: planned
    bcps: 4
    tasks:
      - desc: "Header component — brand, project selector, user menu"
        notes: |
          Create components/Header.tsx:
            - Left: BigBase logo + text
            - Center: breadcrumb (e.g., "Project > SQL Editor > Active Branch")
            - Right: user avatar + dropdown menu (Settings, Sign Out)
            - Project selector slot: (will be populated by e56s05 integration)
            - Height: 56px, background: neutral-0, border-bottom: neutral-100
            - Mobile: hamburger icon (triggers sidebar drawer)
            - Sticky positioning at top of viewport
          Props: title, breadcrumbs, onOpenSettings, onSignOut
        verify: "cd ui && npm run build && npm run test -- Header.test.tsx"
      - desc: "Sidebar component — two-zone layout (global + project)"
        notes: |
          Create components/Sidebar.tsx:
            - Two distinct zones: Global Zone (always visible) and Project Zone (when project selected)
            - Global Zone links: Users, System Monitoring, Platform Settings
            - Project Zone links: Dashboard, SQL Editor, Site, Functions, Storage, Auth, Branches, Settings
            - Collapsible on mobile (drawer overlay)
            - Active link highlighting (brand color accent on left edge)
            - Padding: 16px horizontal, 12px vertical per item
            - Icons + labels for each nav item
            - Visual divider between zones (neutral-100 border)
            - Props: projectId, currentPath, onNavigate, isMobile
          Styling: neutral-0 background, hover state on items (neutral-40 background)
        verify: "cd ui && npm run build && npm run test -- Sidebar.test.tsx"
      - desc: "Mobile drawer — responsive sidebar on small screens"
        notes: |
          Create components/MobileDrawer.tsx:
            - Overlays sidebar on mobile devices (<640px breakpoint)
            - Triggered by header hamburger icon
            - Semi-transparent backdrop (click to close)
            - Slide-in animation from left (transform: translateX)
            - Keyboard: Escape key closes drawer
            - Touch: swipe left to close
          Uses Sidebar component as content (reuse).
        verify: "cd ui && npm run build && npm run test -- MobileDrawer.test.tsx"
      - desc: "Grid + Modal base components"
        notes: |
          Create components/Grid.tsx — CSS grid wrapper with responsive column counts
            - Props: cols (number), gap (spacing token), children
            - Responsive: cols="auto" → auto-fit columns based on content width
            - Example: <Grid cols={3} gap={16}> for 3-column layout on desktop, 1 column on mobile
          Create components/Modal.tsx — overlay modal dialog
            - Props: open (boolean), onClose, title, children, footer (optional)
            - Backdrop: semi-transparent (neutral-900, 30% opacity), click closes modal
            - Animation: fade-in + scale (transform: scale(0.95) → 1)
            - Keyboard: Escape closes modal, Tab cycles focus inside modal
            - Accessibility: role="dialog", aria-modal="true", aria-labelledby
        verify: "cd ui && npm run build && npm run test -- Grid.test.tsx && npm run test -- Modal.test.tsx"

  - id: e56s04
    title: "Console Page Templates & Integration"
    status: planned
    bcps: 3
    tasks:
      - desc: "Page layout template — Header + Sidebar + Main content"
        notes: |
          Create components/PageLayout.tsx:
            - Composition: <PageLayout><Header/><Sidebar/><main className=content/></PageLayout>
            - Grid structure: sidebar (200px fixed) | main (flex: 1)
            - Main padding: 32px top/bottom, 24px left/right
            - Responsive: sidebar collapses to drawer on mobile (<640px)
            - Props: children, showSidebar, headerTitle, breadcrumbs
          Apply to 3 key pages (proof of concept):
            1. /project/:projectId → Dashboard (connection string, stats, recent deployments)
            2. /project/:projectId/sql → SQL Editor (query editor pane + results pane)
            3. /project/:projectId/settings → Project Settings (form with Delete action)
        verify: "cd ui && npm run build && ls -la src/pages/Dashboard.tsx src/pages/SQLEditor.tsx"
      - desc: "Dashboard page — connection string card, quick stats, recent deployments"
        notes: |
          Create pages/Dashboard.tsx:
            - Card grid (3 columns, responsive):
              * Connection String card (copyable, format toggle: psql / URI / env var)
              * Quick Stats card (tables count, rows, storage used) — from backend API
              * Recent Deployments card (list of last 5 deploys with status badges)
            - Branch cards (horizontal scroll or grid): branch name, status, last active
            - Uses: <Card>, <Badge>, <Button>, <Grid>, <PageLayout>
            - Fetches data from backend via useEffect + useState
          Styling: all token colors, spacing, shadows.
        verify: "cd ui && npm run build && npm run test -- Dashboard.test.tsx"
      - desc: "SQL Editor page — editor pane + results grid"
        notes: |
          Create pages/SQLEditor.tsx:
            - Left pane (60%): Monaco editor or Ace editor for SQL input
            - Right pane (40%): results grid (table format) + execution time
            - Header controls: Execute button (brand primary), Clear, Format, Branch selector
            - Result modes: table view (default), JSON view, CSV export
            - Error handling: display error message in red banner if query fails
            - Keyboard shortcut: Cmd/Ctrl+Enter to execute
          Uses: <Button>, <Badge> (for status), results <Grid>, <PageLayout>
        verify: "cd ui && npm run build && ls -la src/pages/SQLEditor.tsx"
      - desc: "Project Settings page — form controls, delete project action"
        notes: |
          Create pages/ProjectSettings.tsx:
            - Form fields (using <Input> components):
              * Project name (text input)
              * Project description (textarea)
              * Database type (select: SQLite, PostgreSQL)
            - Section: Connection pool config (pooling mode, max connections)
            - Section: Danger Zone — Delete Project button
              * Opens <Modal> confirmation dialog
              * Requires typing project name to confirm
              * Submit via POST /api/projects/:id (delete action)
            - Success message after save
          Uses: <Input>, <Button>, <Modal>, <PageLayout>
        verify: "cd ui && npm run build && npm run test -- ProjectSettings.test.tsx"

  - id: e56s05
    title: "Accessibility & Responsive Design Audit"
    status: planned
    bcps: 2
    tasks:
      - desc: "WCAG 2.1 AA compliance verification"
        notes: |
          Run accessibility audits on all components + pages using:
            - axe DevTools (Chrome extension / npm: axe-core)
            - Lighthouse CI (Google Chrome DevTools)
          Checklist:
            - All interactive elements keyboard-accessible (Tab, Enter, Space, Escape)
            - All images/icons have alt text or aria-label
            - Color contrast ratios meet AA standards (4.5:1 for text, 3:1 for UI)
            - Form labels properly associated (<label htmlFor>)
            - Focus indicators visible on all interactive elements (outline or custom)
            - Modals trap focus (Tab cycles within modal only)
            - Semantic HTML: <button>, <input>, <label>, <nav>, <main>
            - ARIA roles used correctly (role="dialog", aria-modal, aria-describedby)
          Document findings in specs/a11y-audit-e58.md.
        verify: "npm run a11y:audit && grep -c 'PASS' specs/a11y-audit-e58.md"
      - desc: "Responsive design testing — mobile, tablet, desktop breakpoints"
        notes: |
          Test all components and pages at breakpoints:
            - Mobile: 360px, 390px (iPhone SE, 14)
            - Tablet: 768px, 1024px (iPad, iPad Pro)
            - Desktop: 1366px, 1920px (common monitor widths)
          Verify:
            - No horizontal scrolling (except in code editors)
            - Touch targets ≥44px × 44px (mobile buttons, inputs)
            - Sidebar collapses to drawer on mobile
            - Grid columns adjust (3 → 2 → 1 on smaller screens)
            - Typography scales appropriately (base 16px, scales per breakpoint)
            - Images scale (max-width: 100%)
            - Modals fit screen height (scrollable if needed)
          Use Chromatic for visual regression testing (Storybook integration).
        verify: "cd ui && npm run chromatic:build"

  - id: e56s06
    title: "Extended Component Library — Table, Form Controls, Dialogs"
    status: planned
    bcps: 6
    tasks:
      - desc: "Table component — sorting, filtering, pagination, row actions"
        notes: |
          Create components/Table.tsx:
            - Props: columns, data, onSort, onFilter, onPaginate, rowActions
            - Column def: { key, label, sortable, filterable, render }
            - States: loading (skeleton rows), empty (zero results), error
            - Pagination: 10/25/50 rows per page, total count display
            - Sorting: click header to sort ascending/descending (visual indicator)
            - Filtering: optional filter row below header (one control per filterable column)
            - Row actions: right-side button menu (edit, delete, copy, view detail, etc.)
            - Responsive: on mobile, show a stacked card view or horizontal scroll
            - Accessibility: table role, header scope, aria-sort on sortable columns
          Use case: SQL results (e59s01), env vars (e41), secrets (e47), users (e52), deployments (e39)
          Styling: neutral-0 background, neutral-100 border rows, hover highlight
        verify: "cd ui && npm run build && npm run test -- Table.test.tsx"
      - desc: "Select, Textarea, Checkbox, Radio components"
        notes: |
          Create components/Select.tsx:
            - Props: options (label/value pairs), value, onChange, disabled, error, label, placeholder
            - Keyboard: arrow keys navigate, Enter selects, Escape closes
            - A11y: listbox role, aria-expanded, aria-selected, aria-describedby for error
            - Styling: matches Input styling, same border and focus ring
          Create components/Textarea.tsx:
            - Props: label, placeholder, value, onChange, rows, disabled, error
            - A11y: label htmlFor, aria-describedby for error, spellcheck support
            - Styling: monospace font option for code snippets
          Create components/Checkbox.tsx:
            - Props: checked, onChange, disabled, label, error
            - Styling: 16x16px checkbox with checkmark animation
            - A11y: label wrapping checkbox, aria-invalid for error state
          Create components/Radio.tsx:
            - Props: name, value, checked, onChange, disabled, label
            - Styling: 16x16px circle with filled inner circle when checked
            - A11y: fieldset/legend for grouped radios, aria-invalid
          Stories: complex examples (controlled components, form submission, validation)
        verify: "cd ui && npm run build && npm run test -- (Select|Textarea|Checkbox|Radio).test.tsx"
      - desc: "DatePicker component — single date, date range"
        notes: |
          Create components/DatePicker.tsx:
            - Props: value (Date or [start, end]), onChange, disabled, placeholder, range (boolean)
            - Display: input field (read-only) that opens a popover calendar
            - Single date: click a date to select and close
            - Date range: click first date, then end date (highlight range in between)
            - Today button, Previous/Next month navigation, year/month selectors
            - Keyboard: arrow keys navigate calendar, Enter selects, Escape closes
            - A11y: role="dialog", aria-label, aria-selected for dates
            - Integration: used in e62 (usage dashboard date range, analytics queries)
        verify: "cd ui && npm run build && npm run test -- DatePicker.test.tsx"
      - desc: "ConfirmDialog component — confirmation pattern for destructive actions"
        notes: |
          Create components/ConfirmDialog.tsx:
            - Props: open, title, message, confirmText, cancelText, onConfirm, onCancel, danger (boolean)
            - Styling: danger variant uses error color for confirm button
            - Example: "Delete project? This cannot be undone. Type 'my-project' to confirm."
            - Text input for high-risk confirmations (optional, props.requireText)
            - Uses Modal component under the hood
            - Keyboard: Escape cancels, Tab cycles between buttons, Enter confirms
            - A11y: autofocus on cancel button (safer default), role="alertdialog"
            - Usage: e58 (delete project), e60 (delete secret), e41 (remove env var), e64 (clear preview)
        verify: "cd ui && npm run build && npm run test -- ConfirmDialog.test.tsx"
      - desc: "Error boundary component — graceful component failure handling"
        notes: |
          Create components/ErrorBoundary.tsx:
            - Catches render errors in child components
            - Displays fallback UI: error icon, "Something went wrong" message, retry button
            - Logs error to console (or error tracking service like Sentry)
            - Props: onError callback, fallback component, children
            - Usage: wrap page components, dashboard cards, data tables, editor panes
            - Does NOT catch async errors; use try/catch in hooks for those
        verify: "cd ui && npm run build && npm run test -- ErrorBoundary.test.tsx"
      - desc: "Loading skeleton & placeholder components"
        notes: |
          Create components/Skeleton.tsx:
            - Props: width, height, rounded (boolean), className
            - CSS animation: pulse fade (0.5s in, 0.5s out)
            - Usage: SkeletonCard, SkeletonTable, SkeletonText (for text blocks)
            - Example: <SkeletonTable cols={4} rows={5} /> for loading states
          Create components/EmptyState.tsx:
            - Props: icon, title, description, action (button CTA)
            - Styling: centered, uses muted colors, plenty of vertical space
            - Usage: "No projects yet", "No SQL results", "No deployments"
        verify: "cd ui && npm run build && npm run test -- (Skeleton|EmptyState).test.tsx"

  - id: e56s07
    title: "Data Visualization & Editor Components — Charts, Code Editor, Terminal"
    status: planned
    bcps: 4
    tasks:
      - desc: "Chart components via Recharts — line, bar, area, pie"
        notes: |
          Set up Recharts integration:
            - Install: npm install recharts
            - Create wrapper components: components/LineChart.tsx, components/BarChart.tsx, components/AreaChart.tsx, components/PieChart.tsx
            - Props: data (array of objects), dataKey (x-axis), series (y-axis keys), title, tooltip, legend, responsive
            - Styling: use design tokens for colors (brand-500 for primary series, neutral-400 for secondary)
            - Dark mode: inherit background colors from theme context
            - Example: <LineChart data={metrics} dataKey="timestamp" series={[cpu, memory]} />
            - Usage: e42 (build cache metrics), e62 (usage dashboard - request count, response time), monitoring dashboards
            - Accessibility: alt text for charts (SVG desc tag), data table fallback on click
        verify: "cd ui && npm run build && npm run test -- (LineChart|BarChart).test.tsx"
      - desc: "Code/SQL editor component via Monaco"
        notes: |
          Set up Monaco editor integration:
            - Install: npm install @monaco-editor/react
            - Create components/CodeEditor.tsx
            - Props: value, onChange, language (sql, javascript, json, typescript), height, readOnly, theme (light/dark)
            - Features:
              * Syntax highlighting for SQL, JavaScript, JSON, etc.
              * Code folding, line numbers, minimap
              * Search/replace (Ctrl+H)
              * Auto-indent, bracket matching
              * Read-only mode for viewing results
              * Keyboard shortcuts: Cmd/Ctrl+Enter = submit (custom callback prop)
            - Styling: inherit theme (light-mode ↔ dark-mode) from theme context
            - Usage: e59s01 (SQL editor), function editor, config file editor
            - A11y: aria-label, tab trapping inside editor, Escape to blur
        verify: "cd ui && npm run build && npm run test -- CodeEditor.test.tsx"
      - desc: "Terminal/Log viewer component — real-time streaming logs"
        notes: |
          Create components/Terminal.tsx:
            - Props: logs (array of log entries), isLive (boolean, append new lines), height, theme, onScroll
            - Log entry structure: { timestamp, level (info, warn, error), message, source (stdout, stderr) }
            - Rendering: monospace font (Fira Code), colored by level (info=neutral, warn=warning, error=error)
            - Auto-scroll: when isLive=true and user is at bottom, follow new logs; if user scrolls up, stop auto-scroll
            - Copy-to-clipboard: select text → Cmd+C
            - Search/filter: optional search box to filter logs by keyword
            - Performance: virtualization for large log sets (window 100 visible lines, render only visible rows)
            - Usage: e39s03 (deploy logs, function logs), e54 (app logs from New Relic), build pipeline logs
            - A11y: screen reader announces new logs (live region), keyboard nav
        verify: "cd ui && npm run build && npm run test -- Terminal.test.tsx"
      - desc: "Tree/Outline component — hierarchical data (schema browser, file tree)"
        notes: |
          Create components/Tree.tsx:
            - Props: items (nested tree structure), onSelect, expandable, selectable, defaultExpanded
            - Item structure: { id, label, icon?, children?, isLeaf?, isLoading? }
            - Features:
              * Expand/collapse arrows (chevron icon)
              * Click to expand/collapse
              * Keyboard: arrow keys navigate, Enter expands/collapses, Space selects
              * Drag-and-drop optional (for reordering, disabled by default)
              * Lazy loading: onLoadChildren callback when expanding a node with isLoading=true
            - Styling: indent 16px per level, hover highlight on items
            - Usage: e50 (schema designer - table/column tree), file browser, navigation hierarchy
            - A11y: role="tree", aria-expanded, aria-selected, aria-level for nesting
        verify: "cd ui && npm run build && npm run test -- Tree.test.tsx"
