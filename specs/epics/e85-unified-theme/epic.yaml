note: >
  2 stories, ~8 BCPs. The server-rendered landing page (homeTemplate in
  components/proxy/proxy.go) gains full theme parity with the React admin
  console: light/dark + the 13 accent colors. Transport is client-side
  localStorage — both surfaces are same-origin (bigbase.click), so the landing
  page reads the admin's existing `bigbase-theme` / `bigbase-accent` keys via a
  blocking inline <head> script and applies data-theme + brand CSS custom props
  before paint. No backend, no new endpoint, no DB migration. ADDED requirement.
