          In ui/src/components/Badge.tsx:
            - Add statusBadgeVariant for 'draining' → 'warning'
            - Add statusBadgeVariant for 'stopped' → 'neutral'
        verify: "cd ui && npm run build"
      - id: e45s02t4
        desc: "Admin UI: update SiteDetailPage test for new statuses"
        notes: |
          In ui/src/pages/SiteDetailPage.test.tsx:
            - Update test fixtures that used 'replaced' to use 'stopped'
            - Add test for 'draining' status rendering
            - Keep backward compat with rollout of new statuses
        verify: "cd ui && npx tsc --noEmit && cd ../.. && go test ./components/proxy/ -run TestDualDeployRouting -v"
