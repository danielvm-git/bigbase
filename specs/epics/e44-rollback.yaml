type: epic-shard
context: domain
id: e44
title: "Deploy — One-Click Rollback"
wsjf: 5.0
wsjf_rationale: "BV=9(critical: solo dev safety net — bad deploy at midnight needs one-click fix, not git revert + rebuild) TC=5(more urgent as more sites go live) RR=9(elimoinates multi-minute recovery: rollback is seconds) / JS=2(~1.5 days across 2 stories)"
status: planned
tier: 4
depends_on:
  - e43
covers:
  - components/deploy/
  - ui/
stories:
  - id: e44s01
    title: "Backend — rollback to previous successful deployment"
    status: planned
    bcps: 2
    tasks:
      - desc: "Add rollback table migration + API endpoint POST /api/sites/:id/rollback"
        notes: |
          Create `rollback_events` table: id, site_id, deployment_id, rolled_back_to_id, created_at.
          Add route `/api/sites/{id}/rollback` to Handler() mux.
          Look up the most recent deployment for the site with status 'running' (the codebase uses 'running' not 'live').
          Exclude the current active deployment (the one to be rolled away from).
          Query: SELECT id, port, app_type, build_dir FROM deployments WHERE site_id = ? AND status = 'running' AND id != ? ORDER BY created_at DESC LIMIT 1.
          Error 409 if no previous successful deployment exists.
          On success 200, call d.stopDeployment(currentID, 'rolled_back') to stop the current app.
          Call d.TransitionState(ctx, currentID, 'rolled_back') for state tracking.
          Create rollback_event record: rolled_from=currentID, rolled_to=oldID.
          Update old deployment status back to 'running'.
          Re-register host router with old deployment's port.
          Implement Rollback(ctx, siteID) method on Deploy struct.
        verify: "go test ./components/deploy/ -run TestRollbackAPI -v"
      - desc: "Serve old build artifacts on rollback (no rebuild)"
        notes: |
          Build artifacts persist at buildDir/id/ for every deployment.
          On rollback: the old deployment's build dir still exists on disk.
          For static sites: call d.serveStatic() with the old build dir, old port, old deploy.
          For process apps: call d.startApp() with the old build dir, old deploy, old app type.
          The old deployment already has a port stored in the DB — reuse it.
          Register host router with old host + old port so proxy routes traffic.
          No clone, npm install, or build step needed — rollback is <1s.
          Append deploy log: "→ Rolled back to deployment {id} (commit {sha})".
          Update old deployment's status_history with transition to 'running'.
        verify: "go test ./components/deploy/ -run TestRollbackArtifacts -v"
  - id: e44s02
    title: "Admin UI — rollback button and history"
    status: planned
    bcps: 1
    tasks:
      - desc: "Add rollback button to deployment detail page"
        notes: |
          Button: "Rollback to previous version" with confirmation dialog.
          Show what version it will roll back to: timestamp, commit SHA, app type.
          Disable button if no previous deployment exists.
          After rollback: redirect to the new live deployment with success toast.
        verify: "cd ui && npm run build"
      - desc: "Rollback history timeline on site detail page"
        notes: |
          Show all rollback events with: timestamp, rolled from, rolled to, who triggered.
          Link to the specific deployment pages.
          Highlight current live deployment vs rollback targets.
        verify: "cd ui && npm run build"
