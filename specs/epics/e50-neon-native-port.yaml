type: epic-shard
context: domain
id: e50
title: "Native Feature Port — SQL-over-HTTP, Better Auth, MCP Migration Tools"
wsjf: 6.0
wsjf_rationale: "BV=9(high: makes BigBase self-sufficient — no Neon dependency for SQL SDK, auth, or migrations) TC=6(blocks big-news and any project wanting native SQL access) RR=7(foundational for developer DX) / JS=4(~3 days across 5 stories, 15 BCPs)"
status: planned
tier: 1
depends_on: [e48]
covers:
  - components/db/
  - components/auth/
  - components/mcp/
  - packages/
notes: |
  **HARD DEPENDENCY:** e56 (Project Scoping) MUST be complete before this epic starts.
  Without project isolation, database branching and HTTP SQL would operate on a global pool
  of databases, creating namespace pollution and security risks.

  This epic ports four capabilities studied from Neon's open-source libraries
  (via opensrc — neondatabase/neon-js, neondatabase/serverless, neondatabase/neonctl):
    1. SQL-over-HTTP with tagged template literals (@neondatabase/serverless pattern)
    2. Better Auth as BigBase's auth engine (@neondatabase/auth pattern)
    3. MCP database migration tools (Neon MCP server pattern)
    4. Astro SDK refactored to match @danielvm/neon-astro-auth reference
stories:
  - id: e50s01
    title: "@bigbase/sql — HTTP SQL transport with tagged template literals"
    status: planned
    bcps: 3
    tasks:
      - desc: "Backend: POST /api/projects/:projectId/sql — execute parameterized SQL"
        notes: |
          Accepts: { query: string, params: any[], options?: { arrayMode?: boolean, fullResults?: boolean } }
          Returns: { command, rowCount, rows: any[], fields: { name, dataTypeID }[] }
          Implements PostgreSQL-style parameterized queries ($1, $2 placeholders).
          Binary data: bytea hex format. Auth: validates JWT + project membership.
          Pooled endpoint: uses PgBouncer or direct connection pool.
          Rate limiting: max 100 queries/min per project (configurable).
        verify: "go test ./components/db/ -run TestSQLOverHTTP -v"
      - desc: "TypeScript client: @bigbase/sql package with tagged template API"
        notes: |
          New package at packages/sql/. API matches @neondatabase/serverless:
            import { bigbase } from '@bigbase/sql';
            const sql = bigbase({ projectId: 'proj_123' });
            const rows = await sql`SELECT * FROM users WHERE email = ${email}`;
          Query composition: sql fragments can be embedded inside other queries.
          Transaction support: sql.transaction([...]) for batch queries.
          Authentication: uses @bigbase/auth client for automatic JWT injection.
          Types: inferred from query results via type generation (optional).
        verify: "cd packages/sql && npm run build && npm test"
      - desc: "Array mode and full results support"
        notes: |
          arrayMode: true → rows returned as arrays instead of objects.
          fullResults: true → returns { command, rowCount, rows, fields } (matches node-postgres).
          Implemented in both backend endpoint and TypeScript client.
          Document the API with JSDoc examples matching Neon's docs style.
        verify: "go test ./components/db/ -run TestSQLArrayMode -v"
  - id: e50s02
    title: "Database branching — CREATE DATABASE WITH TEMPLATE per project"
    status: planned
    bcps: 4
    tasks:
      - desc: "Backend: branch creation via Postgres CREATE DATABASE WITH TEMPLATE"
        notes: |
          POST /api/projects/:projectId/branches — create a new branch.
          Body: { name: string, source?: string } (source defaults to main).
          SQLite: copy data/projects/{projectId}/main.db → data/projects/{projectId}/{branch}.db.
          Postgres: CREATE DATABASE {branch} WITH TEMPLATE {source} OWNER {project_owner}.
          Branch metadata stored in project_branches table: id, project_id, name, source_branch, db_name/db_path, created_at, last_active.
          Connection string per branch: postgres://user@host/{branch} or file:path/to/branch.db for SQLite.
        verify: "go test ./components/db/ -run TestProjectBranching -v"
      - desc: "Branch lifecycle — list, switch, delete"
        notes: |
          GET /api/projects/:projectId/branches — list branches with status, size, last active.
          DELETE /api/projects/:projectId/branches/:branchId — drop database (Postgres: DROP DATABASE, SQLite: delete file).
          "main" is the default branch that cannot be deleted.
          Branch switching: update context middleware to resolve the active branch.
          Per-branch connection pooling: separate pool per database.
        verify: "go test ./components/db/ -run TestBranchLifecycle -v"
      - desc: "UI: branch selector and management page"
        notes: |
          Branch selector in header (next to project selector, only when on SQL/Branches pages).
          Branch page at /project/:projectId/branches:
            - Card grid of branches: name, status, last active, size
            - [Switch] button changes active branch
            - [Delete] with confirmation dialog
            - [Create branch] modal: name input, source branch dropdown
          Branch context hook: useBranchScope() → { branch, branches, setBranch, createBranch, deleteBranch }.
        verify: "cd ui && npm run build"
  - id: e50s03
    title: "Better Auth backend engine — adapter for BigBase auth endpoints"
    status: planned
    bcps: 3
    tasks:
      - desc: "Backend: implement Better Auth protocol endpoints in components/auth/"
        notes: |
          Better Auth client expects these endpoints:
            POST /api/auth/sign-in/email — email + password login
            POST /api/auth/sign-up/email — email + password + name registration
            GET /api/auth/get-session — returns session from cookie
            POST /api/auth/sign-out — clear session cookie
          BigBase's existing endpoints (/api/auth/login, /api/auth/register) continue working.
          New endpoints follow Better Auth's JSON protocol (compatible with @better-auth/client).
          Session cookies: use Better Auth's cookie format (better-auth.session_token).
          Project-scoped: endpoints extract project_id from context, segregate users by project.
        verify: "go test ./components/auth/ -run TestBetterAuthProtocol -v"
      - desc: "Client SDK: @bigbase/auth v2 with Better Auth compatibility"
        notes: |
          Update packages/auth/ to export a createAuthClient function:
            import { createAuthClient } from '@bigbase/auth';
            const auth = createAuthClient({ baseUrl: 'https://my.bigbase.app', projectId: 'proj_123' });
            await auth.signIn.email({ email, password });
            const session = await auth.getSession();
          Internal adapter pattern matches @neondatabase/auth:
            - Vanilla adapter: framework-agnostic fetch-based client
            - React adapter: hooks (useSession, useUser)
            - Vue adapter: composables (useSession, useUser)
          Backward compat: existing @bigbase/auth API still works, new API is additive.
        verify: "cd packages/auth && npm run build && npm test"
      - desc: "Plugin support — email OTP, magic links, anonymous sessions"
        notes: |
          Better Auth plugins ported to BigBase:
            - emailOTP: POST /api/auth/sign-in/email-otp → sends one-time code
            - magicLink: POST /api/auth/sign-in/magic-link → sends sign-in link
            - anonymous: POST /api/auth/sign-in/anonymous → creates anonymous session
          Each plugin is opt-in per project (configured in project_settings).
          Email sending: uses BigBase's messaging component for SMTP delivery.
        verify: "go test ./components/auth/ -run TestAuthPlugins -v"
  - id: e50s04
    title: "MCP database migration tools — prepare, apply, describe, diff"
    status: planned
    bcps: 3
    tasks:
      - desc: "Backend: SQL sandbox — execute DDL in isolation and verify"
        notes: |
          MCP tool: bigbase_db_prepare_migration(sql: string, project_id: string, branch: string?)
            - Creates a temporary branch from the specified source
            - Executes the DDL SQL on the temp branch
            - Validates no errors (table exists, constraints valid)
            - Returns: migration_id, temp_branch, validation_result
          MCP tool: bigbase_db_apply_migration(migration_id: string)
            - Applies the validated migration to the target branch
            - Cleans up the temp branch
            - Returns: applied_at, affected_tables
          MCP tool: bigbase_db_describe_table(table: string, project_id: string, branch: string?)
            - Returns: columns (name, type, nullable, default), indexes, constraints
          MCP tool: bigbase_db_run_sql(sql: string, project_id: string, branch: string?)
            - Returns: rows, row_count, execution_time_ms
          All tools registered in components/mcp/mcp.go.
        verify: "go test ./components/mcp/ -run TestDBMigrationTools -v"
      - desc: "Schema diff — compare schemas between branches"
        notes: |
          MCP tool: bigbase_db_schema_diff(project_id: string, source_branch: string, target_branch: string?)
            - Compares table schemas between two branches
            - Returns: added_tables, removed_tables, modified_tables (column diffs)
          Uses PostgreSQL's information_schema or SQLite's sqlite_master.
          Implementation: query both schemas, diff the DDL output.
          Useful for AI agents to generate targeted migration SQL.
        verify: "go test ./components/mcp/ -run TestSchemaDiff -v"
      - desc: "Connection string tool — pooled + direct endpoints"
        notes: |
          MCP tool: bigbase_get_connection_string(project_id: string, branch: string?, type: pooled | direct)
            - Pooled: returns connection string for pgbouncer/pool endpoint
            - Direct: returns connection string for direct database access
          For Postgres: pooled uses pgbouncer port (if configured), direct uses db port.
          For SQLite: returns file path (pooled/direct distinction not applicable).
          Document the distinction: pooled for web traffic, direct for DDL/migrations.
        verify: "go test ./components/mcp/ -run TestConnectionStringTool -v"
  - id: e50s05
    title: "Astro SDK refactor — middleware, route handler, client pattern"
    status: planned
    bcps: 2
    tasks:
      - desc: "Refactor packages/auth-astro/ to match @danielvm/neon-astro-auth pattern"
        notes: |
          Three-file architecture:
            1. integration.ts — AstroIntegration hook: injects route + middleware
               export function bigbaseAuth(config?: { baseUrl?: string }) → AstroIntegration
               Sets environment variables: BIGBASE_AUTH_BASE_URL, BIGBASE_AUTH_COOKIE_SECRET
               Injects route: /api/auth/[...slug] → route-handler.ts
               Adds middleware: order pre → middleware-handler.ts
            2. middleware-handler.ts — validates session cookie, attached to Astro.locals.session
               Reads BIGBASE_AUTH_BASE_URL env var
               Gets session via fetch to /api/auth/get-session
               Sets Astro.locals.session = { user, projectId } | null
            3. route-handler.ts — proxies auth API calls (sign-in, sign-up, callback)
               Forwards all requests to BigBase's /api/auth/* endpoints
               Preserves headers, cookies, body
          Developer DX: 2 lines to add auth to any Astro project
        verify: "cd packages/auth-astro && npm run build"
      - desc: "Migrate exports — drop-in replacement for existing @bigbase/auth-astro users"
        notes: |
          Old API: import { createBigBaseAuth, getSession } from '@bigbase/auth-astro'
          New API: import { bigbaseAuth } from '@bigbase/auth-astro' (Astro integration)
          Middleware: import { sessionGuard } from '@bigbase/auth-astro/middleware'
          Client: import { createAuthClient } from '@bigbase/auth-astro/client'
          Deprecate old exports with @deprecated JSDoc, keep for backward compat.
          Update package.json version to 1.0.0 (breaking change in API shape, backward compat for behavior).
        verify: "cd packages/auth-astro && npm run build"
