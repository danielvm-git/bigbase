type: epic-shard
context: developer-tooling
id: e41
title: "DX — Automated PR Code Review via PR-Agent + DeepSeek"
wsjf: 7.0
wsjf_rationale: "BV=5(catches bugs before prod, enforces Go conventions automatically for solo dev) TC=2(no urgency, no customer blocking) RR=7(reduces risk of shipping regressions; auto-review every PR before merge) / JS=2(~2h: 1 workflow file + 1 config file + 1 GitHub secret)"
status: done
tier: 2
evidence: |
  Integrated PR-Agent v0.36 with DeepSeek V4 Pro via OpenAI-compatible endpoint.
  Validated with test PR: full review posted with effort estimate, test check, security
  audit, and focus area recommendations. No code suggestions (correct for trivial PR).

  Config lessons learned during integration:
  - @main has hardcoded GPT-5 model names — must pin to stable version (v0.36)
  - LiteLLM needs provider/model-name format: openai/deepseek-v4-pro
  - custom_model_max_tokens=128000 required for models not in MAX_TOKENS list
  - synchronous events are skipped by default (synchronize, push)
  - First PR can't self-review (workflow file not on main)
  - Branch protection with PR-required + status checks set on main

covers:
  - .github/workflows/pr-review.yaml
  - .pr_agent.toml
  - .github/PULL_REQUEST_TEMPLATE.md
  - Branch protection rules on main

