type: epic-shard
context: domain
id: e51
title: "Deploy — Secrets Management"
wsjf: 3.5
wsjf_rationale: "BV=6(moderate: stops hardcoding keys in repos — needed for build cache and preview envs) TC=3(no urgent breach) RR=5(prevents accidental credential exposure) / JS=3(~2 days across 2 stories)"
status: planned
tier: 5
depends_on: [e47, e48]
covers:
  - components/deploy/
  - ui/
stories:
  - id: e51s01
    title: "Encrypted secrets storage and API"
    status: planned
    bcps: 2
    tasks:
      - desc: "Create secrets table with encryption-at-rest"
        notes: |
          Table: secrets(id, site_id, key, value_encrypted, key_fingerprint, created_at, updated_at, version).
          Encrypt with AES-256-GCM. Server key from --secrets-encryption-key flag or auto-generated + stored.
          API: GET/POST/PUT/DELETE /api/sites/:id/secrets.
          Key format: uppercase alphanumeric + underscore (like env vars).
          Version tracking: each update creates a new version, old versions retained for rollback.
        verify: "go test ./components/deploy/ -run TestSecretsAPI -v"
      - desc: "Inject secrets into build and runtime environments"
        notes: |
          Merge with env vars from e41 (env vars are user-visible, secrets are masked).
          Injection order: secrets override env vars if key conflicts.
          Build time: export as env vars during build. Runtime: export during start.
          Secrets never appear in build logs (redact values).
        verify: "go test ./components/deploy/ -run TestSecretInjection -v"
  - id: e51s02
    title: "Secrets UI in admin panel"
    status: planned
    bcps: 1
    tasks:
      - desc: "Add 'Secrets' tab to SiteDetailPage alongside 'Environment Variables'"
        notes: |
          Table: key, masked value (never show full value), version, last updated.
          Add/edit: key + value input with show/hide toggle. Save encrypts and stores.
          Delete: confirmation dialog. Cannot recover deleted secrets.
          Visual distinction: secrets have a lock icon, env vars have a key icon.
        verify: "cd ui && npm run build"
      - desc: "Audit log for secret access and changes"
        notes: |
          Log: who accessed/created/updated/deleted each secret, timestamp, IP.
          Display in site audit log tab.
          No value logging — only metadata.
        verify: "go test ./components/deploy/ -run TestSecretAudit -v"
