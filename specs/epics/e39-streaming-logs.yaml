type: epic-shard
context: domain
id: e39
title: "Deploy — Streaming Build Logs & State Machine"
wsjf: 5.0
wsjf_rationale: "BV=9(critical: debugging alone is the #1 solo dev pain — real-time logs are your only pair programmer) TC=5(no deadline, but every failed deploy without logs is a productivity black hole) RR=8(elimoinates 'why did my deploy fail?' guesswork) / JS=4(~3 days across 3 stories)"
status: in_progress
tier: 1
depends_on: []
covers:
  - components/deploy/deploy.go
  - components/proxy/proxy.go
  - ui/
stories:
  - id: e39s01
    title: "Real-time log streaming — WebSocket endpoint for build logs"
    status: done
    bcps: 2
    tasks:
      - desc: "Add WebSocket endpoint GET /api/deployments/:id/logs/stream that streams build log lines in real-time as the build progresses"
        notes: |
          Replace the current polling-based log fetch with a push model.
          Use a channel/buffer per deployment that the build process writes to.
          WebSocket reads from the channel and sends each line as a text frame.
          Fall back to polling if WebSocket not available (existing GET /api/deployments/:id/logs).
        verify: "go test ./components/deploy/ -run TestStreamingLogs -v"
      - desc: "Wire the streaming endpoint into the deployment lifecycle — start buffering logs at 'building' state"
        notes: |
          In runDeployment(), before starting the build, initialize a line buffer.
          Capture build stdout+stderr into the buffer line-by-line.
          Broadcast via event bus for any subscribed WebSocket connections.
        verify: "go test ./components/deploy/ -run TestLogLifecycle -v"

  - id: e39s02
    title: "Deployment state machine — pending -> building -> deploying -> running/failed"
    status: done
    bcps: 3
    notes: |
      v2 SAFETY DESIGN: 'running' is terminal state (NOT 'live'). Zero SQL queries change.
      'deploying' is the only new state (transitional).
      Lenient mode: unknown statuses are allowed through.
      stopDeployment() bypasses state machine for 'replaced'.
      Root cause of v1 outage: pre-existing resumeCandidates bug (fixed v2.36.2).
    tasks:
      - id: e39s02t1
        desc: "components/deploy/state_machine.go — define DeploymentState type + stateMachine with valid transitions"
        status: done
        notes: |
          Already implemented and on main. Verified: 4 tests pass (TestStateMachineValidTransitions,
          TestStateMachineInvalidTransitions, TestStateMachineIsValidState, TestStateConstants).
          TestStateMachineStruct also passes.
        verify: "go test ./components/deploy/ -run TestStateMachine -v"

      - id: e39s02t2
        desc: "TransitionState() method — validated transition + DB persistence + lenient mode"
        status: done
        notes: |
          Already implemented and on main. TransitionState() at deploy.go:984.
          5 tests pass: TestTransitionStateValidTransitions, TestTransitionStateInvalidRejected,
          TestTransitionStateIdempotent, TestTransitionStateLenientMode,
          TestTransitionStateStatusHistoryPersistence.
          Deployment struct includes StatusHistory field. Call sites already refactored.
        verify: "go test ./components/deploy/ -run TestTransitionState -v"

      - id: e39s02t3
        desc: "Emit deploy.state_changed events on kernel event bus"
        status: done
        notes: |
          Already implemented and on main. eventBus field at deploy.go:101.
          2 tests pass: TestTransitionStateEmitsEvent, TestTransitionStateNilEventBus.
        verify: "go test ./components/deploy/ -run TestStateEvents -v"

      - id: e39s02t4
        desc: "Enhance admin UI status timeline — animations, polling, Live badge"
        status: done
        notes: |
          Already done on main:
            - Types: DeploymentStatus includes 'deploying' ✅
            - StatusTransition + status_history in Deployment interface ✅
            - StatusTimeline component renders colored dots + step labels ✅
          
          Remaining:
            - Visual indicators:
              pending   -> gray dot (exists)
              building  -> spinning/pulse animation (currently plain dot)
              deploying -> yellow/pulse animation (currently plain dot)
              running   -> green checkmark, display as 'Live' badge (currently brand dot)
              failed    -> red X (exists as red dot)
            - Poll interval: currently 3s → change to 2s; add 'deploying' to active-status check
            - Add CSS keyframe animations for in-progress states
        verify: "cd ui && npm run build"

      - id: e39s02t5
        desc: "Integration test — full lifecycle + restart cycle"
        status: done
        notes: |
          Test 1: Full lifecycle (static site)
            - Create repo, trigger deploy
            - Verify: pending -> building -> running
            - Verify: status_history has 2 transitions with valid timestamps
            - Verify: state change events emitted per transition
            - Verify: failed deployment: building -> failed
            - Verify: invalid transition returns error

          Test 2: Process app lifecycle
            - Create Go/Python/Node repo, trigger deploy
            - Verify: pending -> building -> deploying -> running
            - Verify: 'deploying' is transient (exists before startApp)

          Test 3: RESTART CYCLE (critical safety test)
            - Deploy process app → status = 'running'
            - Stop Deploy component, start NEW Deploy component (same DB)
            - Verify: resumeCandidates found and resumed the app
            - Verify: status still 'running' (not converted to unknown state)
            - Verify: TransitionState lenient mode doesn't block resume
        verify: "go test ./components/deploy/ -run TestStateLifecycle -v"

  - id: e39s03
    title: "Terminal-style live log viewer in admin UI"
    status: planned
    bcps: 2
    tasks:
      - id: e39s03t1
        desc: "Add WebSocket streaming support to useBuildLogs hook"
        notes: |
          Connect to /api/deploy/:id/logs/stream WebSocket endpoint.
          Accumulate lines from WebSocket messages. On disconnect, settle.
          Fall back to existing polling if WebSocket fails (network error or 404).
          Expose isStreaming boolean so UI can show live indicator.
          Keep existing lines[], loading, error, status return shape.
        verify: "cd ui && npx tsc --noEmit"
      - id: e39s03t2
        desc: "Enhance StreamLog component with terminal toolbar and ANSI colors"
        notes: |
          Add toolbar: search/filter input, "Copy all" button, timestamp toggle.
          ANSI color parsing: strip or convert ANSI escape sequences (npm/yarn use colors).
          Use ansi-to-html or a minimal regex-based converter (no new deps if possible).
          Keep existing StreamLog props + add new optional ones (searchQuery, onSearchChange).
          Keep the dark theme (#0d1117 bg, #e6edf3 text, monospace).
          Add LoadingDots animation during streaming.
        verify: "cd ui && npm run build"
      - id: e39s03t3
        desc: "Create TerminalLogViewer and replace BuildLogs in SiteDetailPage"
        notes: |
          New component TerminalLogViewer wraps StreamLog + toolbar + useBuildLogs.
          Props: deploymentId (string). Handles loading/error/empty states internally.
          Replaces <BuildLogs> in SiteDetailPage.tsx logs tab.
          Wire the existing isStreaming from the hook to show LIVE badge.
          Keep polling fallback — WebSocket degrades gracefully to polling.
        verify: "cd ui && npm run build && go test ./components/deploy/ -run TestLogsAPI -v"
      - id: e39s03t4
        desc: "Deprecate old BuildLogs — remove export, clean up index"
        notes: |
          Remove BuildLogs from ui/src/components/index.ts export list.
          Keep BuildLogs.tsx file on disk (git history reference, no breaking imports).
          Verify no remaining imports of BuildLogs across the UI codebase.
          Run full build to confirm no broken references.
        verify: "cd ui && npm run build"
