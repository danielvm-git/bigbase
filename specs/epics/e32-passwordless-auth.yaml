type: epic-shard
context: domain
id: e32
title: Passwordless Auth + User Management
wsjf: 6.0
wsjf_rationale: "BV=8(passwordless is modern auth standard, user mgmt is basic expectation) TC=5(delays SPA adoption if missing) RR=5(reduces friction for new users) / JS=3(~2-3 days across 3 stories)"
status: done
depends_on: [e31]
covers:
  - components/auth/auth.go
  - components/auth/auth_test.go
  - main.go
stories:
  - id: e32s01
    title: Email OTP — one-time password authentication
    status: done
    bcps: 5
    wsjf: 5.33
    wsjf_rationale: "BV=8(passwordless removes sign-up friction) TC=5(expected for modern BaaS) RR=3(low risk, reuses existing email sender) / JS=3(~2-3 days: send + verify + tests)"
    tasks:
      - desc: "Add POST /api/auth/otp/send — generates 6-digit code, stores with 5min TTL, sends via email"
        notes: |
          components/auth/auth.go:
          — handleSendOTP: accepts {email}. Generates crypto/rand 6-digit numeric code.
          — Store in new table: otp_codes (id, email, code_hash, expires_at, attempts, created_at).
          — Hash code with SHA-256 before storing (never store plaintext).
          — Max 3 attempts per code. Max 3 codes per email per hour (rate limit).
          — Reuse existing emailSender to send code.
          — Return 200 {ok:true} even if email not registered (don't leak user existence).
          — Route registered in Handler() (unauthenticated).
          — CLI flag: --auth-otp-enabled (default false — off by default for safety).
        verify: "go test ./components/auth/ -run TestOTPSend -v"
      - desc: "Add POST /api/auth/otp/verify — verifies code, creates user if new, returns JWT"
        notes: |
          components/auth/auth.go:
          — handleVerifyOTP: accepts {email, code}. Hash code, compare with stored hash.
          — If match: delete code row, find or create user (same as verify-email flow).
          — Return JWT via writeAuthResponse (same as login/register — sets cookie + returns token).
          — If no match: increment attempts. After 3 failures, delete code row.
          — If code expired (5min TTL): return 410 "code expired".
          — Route registered in Handler() (unauthenticated).
        verify: "go test ./components/auth/ -run TestOTPVerify -v"
      - desc: "Test OTP flow end-to-end — send, receive code, verify, get JWT"
        notes: |
          components/auth/auth_test.go: TestOTPEndToEnd.
          — Create mock email sender that captures the code.
          — Send OTP to test@example.com.
          — Extract code from mock sender.
          — Verify OTP with extracted code.
          — Assert JWT returned in response body and Set-Cookie header.
        verify: "go test ./components/auth/ -run TestOTPEndToEnd -v"

  - id: e32s02
    title: Magic Link — click-to-login authentication
    status: done
    bcps: 3
    wsjf: 4.0
    wsjf_rationale: "BV=5(better UX than OTP — click instead of copy-paste) TC=3(flexible, OTP already covers passwordless) RR=5(reuses OTP infra — just different delivery) / JS=2(~1 day)"
    tasks:
      - desc: "Add POST /api/auth/magic-link/send — generates signed token, emails clickable link"
        notes: |
          components/auth/auth.go:
          — handleSendMagicLink: accepts {email, redirect_to?}.
          — Generate HMAC-signed token (expires in 15 min, single-use).
          — Store token hash in magic_link_tokens table (id, email, token_hash, expires_at, used, created_at).
          — Email the link: {baseURL}/api/auth/magic-link/verify?token={token}&redirect_to={redirect_to}.
          — Reuses OTP rate limiting (3 per email per hour).
          — Returns 200 {ok:true} even if email unknown (no user enumeration).
        verify: "go test ./components/auth/ -run TestMagicLinkSend -v"
      - desc: "Add GET /api/auth/magic-link/verify — verifies token, creates user if new, redirects with JWT"
        notes: |
          components/auth/auth.go:
          — handleVerifyMagicLink: extracts token from query param.
          — Verify HMAC signature. Check expiration (15 min). Check not already used.
          — Mark token as used.
          — Find or create user. Generate JWT.
          — If redirect_to param present AND matches SPAOriginAllowlist: redirect to redirect_to#token={jwt}.
          — Otherwise: set HttpOnly cookie and redirect to PostLoginRedirect (default /admin/).
          — Route registered in Handler() (unauthenticated — GET, no JSON body).
        verify: "go test ./components/auth/ -run TestMagicLinkVerify -v"
      - desc: "Test magic link end-to-end — send, click link, get redirected with JWT"
        notes: |
          components/auth/auth_test.go: TestMagicLinkEndToEnd.
          — Send magic link to test@example.com, capture token from mock email.
          — GET /api/auth/magic-link/verify?token={token}.
          — Assert 302 redirect to /admin/ with Set-Cookie token header.
          — GET again with same token → assert 401 "token already used".
          — Test SPA redirect: configure SPAOriginAllowlist, send redirect_to, assert redirect to SPA URL with #token=.
        verify: "go test ./components/auth/ -run TestMagicLinkEndToEnd -v"

  - id: e32s03
    title: User management endpoints — update profile, linked identities
    status: done
    bcps: 3
    wsjf: 2.67
    wsjf_rationale: "BV=3(nice-to-have — user can't update own profile today) TC=3(flexible) RR=3(low risk) / JS=3(~2-3 days)"
    tasks:
      - desc: "Add PATCH /api/auth/me — allows user to update name and avatar_url"
        notes: |
          components/auth/auth.go:
          — handleUpdateMe in ProtectedHandler.
          — Accepts {name?, avatar_url?}. Update users table row.
          — Return updated user object.
          — Sanitize: name max 100 chars, avatar_url must be valid HTTP URL (optional).
        verify: "go test ./components/auth/ -run TestUpdateMe -v"
      - desc: "Add GET /api/auth/me/identities — lists linked OAuth providers for current user"
        notes: |
          components/auth/auth.go:
          — handleListIdentities in ProtectedHandler.
          — Query users table for google_id. If non-empty, return [{provider:"google", id:"..."}].
          — Future extensible: email/password is always the primary identity.
          — Response: {identities: [{provider, id, email?, name?, avatar_url?, created_at}]}
        verify: "go test ./components/auth/ -run TestListIdentities -v"
      - desc: "Add POST /api/auth/me/identities — link a new OAuth provider to existing account"
        notes: |
          components/auth/auth.go:
          — handleLinkIdentity in ProtectedHandler.
          — Accepts {provider, code} (Google OAuth code).
          — Verify the code via GoogleVerifier. Get GoogleUser.
          — Check google_id not already linked to another user. If clear, UPDATE users SET google_id = ? WHERE id = ?.
          — Return linked identity.
          — Fire event hook for audit log.
        verify: "go test ./components/auth/ -run TestLinkIdentity -v"
      - desc: "Add DELETE /api/auth/me/identities/{provider} — unlink an OAuth provider"
        notes: |
          components/auth/auth.go:
          — handleUnlinkIdentity in ProtectedHandler.
          — Only allow unlinking if user has email/password as fallback (can't lock yourself out).
          — SET google_id = NULL WHERE id = ? AND email IS NOT NULL.
          — If no email set on user: return 400 "cannot unlink only identity".
        verify: "go test ./components/auth/ -run TestUnlinkIdentity -v"
