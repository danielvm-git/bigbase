id: e81
title: "Multi-Language Deploy — Rust, PHP, Java, Ruby"
wsjf: 1.6
wsjf_rationale: "BV=5(rust/java shops) TC=3(no deadline) RR=5(enables new runtimes) / JS=8(2wk)"
status: open
stories:
  - id: e81s00
    title: "VPS runtime installation — Rust, PHP, Java, Ruby"
    status: open
    tasks:
      - desc: "Install Rust toolchain (rustup + cargo) on Contabo VPS"
        verify: "ssh root@89.116.26.187 'rustc --version && cargo --version'"
        infra: true
      - desc: "Install PHP 8.x + composer on Contabo VPS"
        verify: "ssh root@89.116.26.187 'php --version && composer --version'"
        infra: true
      - desc: "Install OpenJDK 21 + Maven on Contabo VPS"
        verify: "ssh root@89.116.26.187 'java --version && mvn --version'"
        infra: true
      - desc: "Install Ruby 3.x + bundler on Contabo VPS"
        verify: "ssh root@89.116.26.187 'ruby --version && gem --version && bundle --version'"
        infra: true
      - desc: "Ensure bigbase user can execute all new runtimes"
        verify: "ssh root@89.116.26.187 'sudo -u bigbase rustc --version && sudo -u bigbase php --version && sudo -u bigbase java --version && sudo -u bigbase ruby --version'"
        infra: true
      - desc: "Restart BigBase service so exec.LookPath() finds new binaries"
        verify: "ssh root@89.116.26.187 'systemctl restart bigbase && systemctl is-active bigbase'"
        infra: true
  - id: e81s01
    title: "Rust runtime support"
    depends_on: [e81s00]
    status: open
    tasks:
      - desc: "Detect Cargo.toml in repo root"
        verify: "go test ./components/deploy/ -run TestDetectRust -v"
      - desc: "Build with cargo build --release"
        verify: "go test ./components/deploy/ -run TestBuildRust -v"
      - desc: "Run compiled binary from target/release/"
        verify: "go test ./components/deploy/ -run TestRunRust -v"
      - desc: "Rust CI template in get_ci_template(app_type='rust')"
        verify: "go test ./components/mcp/ -run TestCITemplateRust -v"

  - id: e81s02
    title: "PHP runtime support"
    depends_on: [e81s00]
    status: open
    tasks:
      - desc: "Detect composer.json in repo root"
        verify: "go test ./components/deploy/ -run TestDetectPHP -v"
      - desc: "Build with composer install --no-dev"
        verify: "go test ./components/deploy/ -run TestBuildPHP -v"
      - desc: "Serve via php built-in server (php -S 0.0.0.0:$PORT)"
        verify: "go test ./components/deploy/ -run TestRunPHP -v"
      - desc: "PHP CI template in get_ci_template(app_type='php')"
        verify: "go test ./components/mcp/ -run TestCITemplatePHP -v"

  - id: e81s03
    title: "Java runtime support"
    depends_on: [e81s00]
