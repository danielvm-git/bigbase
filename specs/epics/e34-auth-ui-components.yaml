stories:
  - id: e34s01
    title: "@bigbase/auth-ui/svelte — Svelte UI components"
    status: planned
    bcps: 8
    wsjf: 5.33
    wsjf_rationale: "BV=10(Copa bolão needs auth UI — #1 priority) TC=8(blocks Copa launch) RR=5 / JS=2(~1 day)"
    tasks:
      - desc: "Implement <SignIn> component — email, OTP, magic link, social modes"
        notes: |
          packages/auth-ui-svelte/src/lib/SignIn.svelte:
          — Props: {authClient, redirectTo?, mode?: 'email'|'otp'|'magic-link', showSocial?: boolean}.
          — Modes tabbed: Email (default), OTP, Magic Link.
          — Social login button: "Sign in with Google" → authClient.signIn.social({provider:'google'}).
          — Email form: email + password inputs, submit → authClient.signIn.email().
          — OTP form: email input → send OTP → code input → verify.
          — Magic Link form: email input → send magic link → "Check your email" state.
          — Error display: inline error message with retry.
          — Loading states on all buttons.
          — Tailwind CSS classes (no hardcoded styles — themeable via CSS variables).
        verify: "cd packages/auth-ui-svelte && npm run build && npm test"
      - desc: "Implement <SignUp> component — email registration with name"
        notes: |
          packages/auth-ui-svelte/src/lib/SignUp.svelte:
          — Props: {authClient, redirectTo?}.
          — Fields: name (optional), email (required), password (required, min 6 chars).
          — Client-side validation: email format, password length, name max 100.
          — Submit → authClient.signUp.email().
          — Success: redirect to redirectTo or emit 'signup' event.
          — Error: inline error message.
        verify: "cd packages/auth-ui-svelte && npm run build && npm test"
      - desc: "Implement <UserButton> component — avatar, dropdown with profile/signOut"
        notes: |
          packages/auth-ui-svelte/src/lib/UserButton.svelte:
          — Props: {authClient}.
          — Subscribes to auth state via onAuthStateChange.
          — When authenticated: shows avatar (or initials fallback), dropdown with:
            • User name + email
            • "Profile" link (configurable href)
            • "Sign Out" button → authClient.signOut()
          — When unauthenticated: shows "Sign In" button → redirect to loginUrl.
          — Keyboard accessible (Enter/Space to toggle, Escape to close, Tab navigation).
        verify: "cd packages/auth-ui-svelte && npm run build && npm test"
      - desc: "Implement <AuthView> component — full auth page router"
        notes: |
          packages/auth-ui-svelte/src/lib/AuthView.svelte:
          — Props: {authClient, path?: 'sign-in'|'sign-up'|'forgot-password'|'otp'|'magic-link'}.
          — Renders the appropriate form based on path prop.
          — Handles mode transitions: "Forgot password?" link → switches to forgot-password view.
          — "Already have an account?" → switches to sign-in view.
          — Usage: <AuthView path="sign-in" /> — single component for entire auth page.
        verify: "cd packages/auth-ui-svelte && npm run build && npm test"
      - desc: "Export all components, CSS, and theme tokens"
        notes: |
          packages/auth-ui-svelte/src/lib/index.ts:
          — Export SignIn, SignUp, UserButton, AuthView.
          — Export CSS: @bigbase/auth-ui-svelte/css (standalone CSS file with CSS variables).
          — Theme tokens: --bb-auth-primary, --bb-auth-bg, --bb-auth-text, --bb-auth-border, --bb-auth-radius.
          — Dark mode support via prefers-color-scheme or data-theme attribute.
        verify: "cd packages/auth-ui-svelte && npm run build && npm test"

