    file: null
    status: fixed
    github_issue: 196
    files_changed:
      - components/deploy/orchestrator.go
      - components/deploy/drain_test.go
    approach: |
      drainDeployment force-kill path used app.cmd.Process.Kill() which only
      sends SIGKILL to the main process. Child processes (Python workers,
      Telegram polling) survived as orphans. Fixed by using killProcessGroup()
      which kills the entire process tree.
