  - id: BUG-2026-07-10T160001
    date: "2026-07-10"
    severity: high
    priority: critical
    scope: auth
    summary: OAuth redirect URI uses attacker-controlled Host when publicURL unset (CWE-601)
    file: specs/bugs/BUG-2026-07-10T160001-oauth-host-header-poisoning.md
    status: fixed
    audit_source: null  # original audit source lost; not in git history
    files_changed:
      - components/auth/auth.go
      - components/auth/auth_test.go
    approach: Added isTestMode() guard in New() that panics in production when googleClientID is set but publicURL is empty, preventing attacker-controlled Host header from being used in OAuth redirect URIs. Rewrote TestOAuthPublicURLFallback as TestOAuthPublicURLOrDefaultIgnoresHostHeader.
    risk_level: low
    regression_guards:
      - components/auth/auth_test.go TestOAuthPublicURLOrDefaultIgnoresHostHeader
    validated:
      date: "2026-07-28"
      verdict: CERTIFIED
      baseline: cedb0fc51
      evidence: |
        Prior note claimed "fix exists in orphaned git commit 8d217c9d — needs
        recovery". That note was STALE and has been removed. Commit 8d217c9d is
        indeed unreachable from HEAD, but the fix IS present in HEAD via a later
        refactor: components/auth/auth.go:222 panics when googleClientID is set
        and publicURL is empty, and PublicURLOrDefault never reads r.Host. Guard
        TestOAuthPublicURLOrDefaultIgnoresHostHeader exists (auth_test.go:1271)
        and passes. Nothing needs recovery.
        Backfill 2026-07-28: the missing doc BUG-2026-07-10T160001-*.md was
        created as a minimal stub so this closed SECURITY bug has a traceable
        artifact on disk.
  - id: BUG-2026-07-10T160002
    date: "2026-07-10"
    severity: high
    priority: critical
    scope: auth
    summary: API key scopes not enforced in auth middleware — full org access (CWE-287)
    file: specs/bugs/BUG-2026-07-10T160002-api-key-scope-bypass.md
    status: fixed
    audit_source: null  # original audit source lost; not in git history
    files_changed:
      - components/auth/middleware.go
    approach: Added RequireScopes middleware that enforces API key scope restrictions on write routes. Scoped org keys now get 403 "insufficient scopes" when accessing routes outside their scope. Unscoped keys and JWT auth pass through for backward compatibility.
    risk_level: high
    regression_guards:
      - components/auth/apikeys_test.go TestRequireScopes_MatchingScopeAllowed
      - components/auth/apikeys_test.go TestRequireScopes_MissingScopeDenied
      - components/auth/apikeys_test.go TestRequireScopes_UnscopedKeyAllowed
      - components/auth/apikeys_test.go TestRequireScopes_JWTAuthBypassesScopeCheck
    validated:
      date: "2026-07-28"
      verdict: CERTIFIED
      baseline: 5a949048d
      evidence: |
        FIXED. RequireScopes middleware (middleware.go:193) now enforces scope
        checks on all write routes in ProtectedHandler. OrgKeyScopesFromContext
        has 4 callers (the 4 test functions). Scoped API keys missing required
        scopes receive 403 "insufficient scopes". Unscoped keys and JWT auth
        bypass scope checks for backward compatibility. All 4 regression tests
        pass; full auth test suite passes (8.8s, 0 failures).
