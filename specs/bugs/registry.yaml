    validated:
      date: "2026-07-28"
      verdict: CERTIFIED
      baseline: 6a5b266e0
      evidence: |
        FIXED. With ui/node_modules/flatted present on disk, `golangci-lint run ./...`
        reports 0 issues (was 2 govet findings in flatted.go before). Config verified
        via `golangci-lint config verify` (valid v2 schema). Local golangci-lint
