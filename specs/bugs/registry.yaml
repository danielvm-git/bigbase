  - id: BUG-2026-07-28T000002
    date: "2026-07-28"
    severity: medium
    priority: medium
    scope: sites
    summary: Legacy org_id=0 site rows are visible to every organization
    file: null
    status: fixed
    source: specs/verifications/BUG-VALIDATION-2026-07-28.md
    related:
      - BUG-2026-07-24T184443
    files_changed:
      - components/sites/sites.go
      - components/auth/middleware.go
      - components/sites/org_scoping_test.go
    approach: |
      components/sites/sites.go:352 lists sites with `WHERE s.org_id = ? OR s.org_id = 0`,
      so any row with org_id=0 was returned to EVERY caller regardless of org. This was
      deliberate (see the comment above the query) and is mitigated by a Start()
      migration that reassigns orphaned rows to an admin org — but that migration runs
      only at boot and only when a user with role='admin' AND default_org_id > 0 exists.
      Nothing prevented new org_id=0 rows from appearing afterwards, and on an install
      with no admin the orphans were never reassigned.
      Confirmed by live probe: a site seeded with org_id=0 was listed by an unrelated org.
      FIX applied: scoped the org_id=0 carve-out to admin-role callers only, in both leak
      points (ListSites query and requireSiteOwnership). A non-admin org now sees/ reaches
      only its own org_id rows; an admin keeps the legacy fallback so the boot-migration
      reassignment path still works. The create-time duplicate-name guard is intentionally
      unchanged (it blocks conflicting names, exposes no data).
    risk_level: medium
    regression_guards:
      - components/sites/org_scoping_test.go TestListSites_NonAdminDoesNotSeeLegacyOrglessSites
      - components/sites/org_scoping_test.go TestRequireSiteOwnership_NonAdminDeniesLegacyOrglessSite
      - components/sites/org_scoping_test.go TestListSites_AdminSeesLegacyOrglessSites
      - components/sites/org_scoping_test.go TestRequireSiteOwnership_AdminAllowsLegacyOrglessSite
      - components/sites/org_scoping_test.go TestListSites_StillIsolatesRealCrossOrgSites
      - components/sites/org_scoping_test.go TestRequireSiteOwnership_StillDeniesRealCrossOrgSite
    validated:
      date: "2026-07-28"
      verdict: CERTIFIED
      baseline: 4b997bcbf
      evidence: |
        FIXED. The two new non-admin leak guards (list + single-site) pass; the two
        renamed admin legacy-visibility guards pass (backward-compat for single-admin
        installs preserved); and the two pre-existing BUG-136 cross-org isolation
        guards still pass (no regression). Full sites package 0 failures; auth and
        deploy packages 0 failures.

  - id: BUG-2026-07-28T000003
    date: "2026-07-28"
    severity: medium
    priority: medium
    scope: ui,ci
    summary: UI test suite fails on Node 26 due to experimental built-in localStorage
    file: null
    status: fixed
    source: specs/verifications/BUG-VALIDATION-2026-07-28.md
    files_changed:
      - ui/src/test-setup.ts
      - .nvmrc
      - ui/package.json
    approach: |
      Under Node 26.3.0, six tests in ui/src/Layout.test.tsx and
      ui/src/context/ThemeContext.test.tsx fail with
      "TypeError: Cannot read properties of undefined (reading 'getItem'/'clear')".
      Node 26 ships an experimental built-in localStorage (gated behind
      --localstorage-file) that conflicts with the jsdom test environment, leaving
      window.localStorage undefined. The same suite is 549/549 green on Node 22.22.3.
      CI pins node-version 20 (ci-cd.yml) / 22 (release-deploy.yml), so CI does not see
      this — but any developer on a current Node sees six spurious failures, and a future
      CI Node bump would break the suite.
      FIX applied: (1) added a guarded localStorage stub in ui/src/test-setup.ts that
      activates only when globalThis.localStorage is undefined (no-op on Node versions
      where jsdom already provides it); (2) pinned .nvmrc to 22 and added
      engines.node ">=20" to ui/package.json so local and CI agree on a major.
    risk_level: low
    regression_guards:
      - "ui: npm run test (vitest) — 79 files / 549 tests pass on Node 22 and Node 24"
    validated:
      date: "2026-07-28"
      verdict: CERTIFIED
      baseline: 6a5b266e0
      evidence: |
        FIXED. vitest suite is 549/549 green on Node 22.22.3 AND Node 24.15.0 with
        the stub in place (verified locally on both). The stub fires on Node 22+
        where the experimental localStorage warning appears, so the fix is
        forward-compatible with a future CI Node bump.

  - id: BUG-2026-07-28T000004
    date: "2026-07-28"
    severity: low
    priority: medium
    scope: ci,lint
    summary: golangci-lint has no config and lints vendored Go files inside ui/node_modules
    file: null
    status: fixed
    source: specs/verifications/BUG-VALIDATION-2026-07-28.md
    related:
      - BUG-2026-06-19T131025
    files_changed:
      - .golangci.yml
    approach: |
      No .golangci.yml or .golangci.yaml exists anywhere in the repo, so the
      "exclude dependency directories" fix recorded against BUG-2026-06-19T131025 was
      never implemented. `go list ./...` resolves ui/node_modules/flatted/golang/pkg/flatted
      into the module's package set, and golangci-lint reports 2 govet issues in that
      vendored third-party file. CI avoids the symptom only because the lint job never
      runs `npm ci` before linting — an incidental ordering dependency, not a fix.
      FIX applied: added .golangci.yml (v2 schema, matching CI's golangci-lint v2.11.0)
      with `linters.exclusions.paths: [ui/node_modules]`. NOTE: the original brief
      proposed `issues.exclude-dirs`, but that key does NOT exist in the v2 schema
      (verified via `golangci-lint config verify`); v2 moved path exclusions to
      `linters.exclusions.paths`.
    risk_level: low
