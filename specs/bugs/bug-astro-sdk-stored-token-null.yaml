    description: "Add setToken(token: string): void to AuthClient interface and createAuthClient implementation in packages/auth/src/index.ts"
    verify: "cd packages/auth && npm run typecheck"
    status: done

  - id: 2
    description: "Build @bigbase/auth to emit updated types"
