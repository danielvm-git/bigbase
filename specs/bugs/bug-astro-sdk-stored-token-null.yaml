type: bug
id: BUG-001
title: "Astro SDK — storedToken null causes silent auth failure in SSR middleware"
status: fixed
severity: high
affects:
  - package: "@bigbase/auth-astro"
    file: "packages/auth-astro/src/index.ts"
  - package: "@bigbase/auth"
    file: "packages/auth/src/index.ts"
reported: "2026-06-29"
depends_on: []
note: |
  Live production bug. Ship immediately — no e57 dependency.
  The createBigBaseAuth middleware extracts a token from the request cookie but never
  passes it to the auth client before calling client.getSession(). Internal storedToken
  remains null, so getSession() sends GET /api/auth/me without Authorization header —
  returning null for every authenticated SSR request.

root_cause: |
  packages/auth-astro/src/index.ts:
    const token = cookieHeader.match(/token=([^;]+)/)?.[1] ?? null;
    if (token) {
      const session = await client.getSession(); // BUG: storedToken is null, token never set

fix:
  summary: |
    1. Add setToken(token: string): void to AuthClient interface and createAuthClient
       implementation in packages/auth/src/index.ts (sets closure-local storedToken).
    2. Fix createBigBaseAuth in packages/auth-astro/src/index.ts: call client.setToken(token)
       before client.getSession() when token is extracted from cookie.
    3. Fix AstroAuth.session type from 'any' to 'AuthSession | null'.
    4. Fix requireAuth return type to 'AstroAuth | Response'.
    5. Export AstroAuthLocals type.
  breaking_changes: false
  migration: none

tasks:
