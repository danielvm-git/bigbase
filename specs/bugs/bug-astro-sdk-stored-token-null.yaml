  - id: 3
    description: "Fix createBigBaseAuth: call client.setToken(token) before client.getSession() when token extracted from cookie"
    verify: "cd packages/auth-astro && npm run build"
    status: done

  - id: 4
    description: "Fix AstroAuth.session type from 'any' to 'AuthSession | null'; fix requireAuth return type to 'AstroAuth | Response'; export AstroAuthLocals"
    verify: "cd packages/auth-astro && npm run build"
    status: done

  - id: 5
    description: "Unit test for setToken: call setToken('abc'), verify getJWT() returns 'abc' without fetch"
    verify: "cd packages/auth && npm test"
    status: done

  - id: 6
    description: "Unit test for createBigBaseAuth: mock fetch; with cookie 'token=jwt123' verify Authorization header sent; without cookie verify locals.auth is null"
    verify: "cd packages/auth && npm test"
    status: done

  - id: 7
    description: "Final build and test pass for both packages"
    verify: "cd packages/auth && npm run build && npm test && cd ../auth-astro && npm run build"
    status: done

verify: |
  cd packages/auth && npm run build && npm test && cd ../auth-astro && npm run build

risk: |
  storedToken in createAuthClient is closure-local. If client instance is shared across
  concurrent requests, setToken could race. Mitigated: createBigBaseAuth calls createAuthClient
  once at setup; Node.js SSR is single-threaded — no concurrent mutation in one process.
  Document this assumption in JSDoc.
