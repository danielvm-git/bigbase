type: requirements-scope
context: domain
version: "1.0.0"
release: "e90: Dev-Environment Hardening"
core_value: >-
  Consolidate dev-environment contracts, eliminate config duplication (MCP, agent docs,
  gosec), close critical CI verification gaps (race detection, UI gates, required-env
  preflight), and enforce tooling hygiene across BigBase.
summary: >-
  Epic e90 addresses technical debt in the dev and CI environment across 9 stories covering
  provisioning, gosec, agent instructions, CI race/UI testing, canonical MCP configs,
  version claims, Dependabot grouping, and async testing patterns.
in_scope:
  - id: e90s01
    title: Provision BIGBASE_ROOT_ENCRYPTION_KEY and add required-env gate to CI
  - id: e90s02
    title: Fix .gitignore conflict marker and consolidate gosec config
  - id: e90s03
    title: Reconcile AGENTS.md ctxo mandate with 2026-08-11 revert reality
  - id: e90s04
    title: Add -race CI job and frontend lint/test gate
  - id: e90s05
    title: Canonical MCP config — single source, generated adapters
  - id: e90s06
    title: Consolidate agent instruction files — AGENTS.md as single source
  - id: e90s07
    title: Version declaration sweep and docs reconciliation
  - id: e90s08
    title: Dependabot grouping and big-release push discipline
  - id: e90s09
    title: Async-assert pattern sweep and test guideline
out_of_scope:
  - item: Rewriting backend business logic or kernel event bus
    reason: e90 is strictly tooling, CI, docs, and environment configuration.
  - item: Changing database schemas or API payload models
    reason: Unrelated to dev environment hardening.
constraints:
  - Pure Go and lightweight Node toolchain where possible.
  - Maintain backward compatibility with existing developer workflows.
