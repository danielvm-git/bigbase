in_scope:
  - Persist deploy defaults (framework, build command, env vars) on site record
  - bigbase.toml manifest in repository root as single source of deploy config
  - TOML parsing with BurntSushi/toml
  - Three-layer config merge: bigbase.toml → site defaults → request body overrides
  - Parameterized CI templates (get_ci_template with deploy defaults)
  - static-sidecar app profile for sidecar-only deployments
  - Validation of TOML schema with clear error messages

out_of_scope:
  - Full CMS for deploy configuration
  - Non-TOML manifest formats (YAML, JSON)
  - Auto-generation of bigbase.toml from existing bigbase.yaml
  - Remote URL-based manifest fetching
  - Manifest inheritance or composition across repos

