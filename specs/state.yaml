  - at: '2026-11-06T13:56:00-03:00'
    gate: verify-work / develop-tdd harness
    decision: >-
      scripts/verify-tdd-red-commit.sh, scripts/verify-adversarial.sh, scripts/bp-timing.sh,
      scripts/bp-read-agents.sh and scripts/lib/assert-epic-gate.sh are absent from this repo
