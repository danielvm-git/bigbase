      that fails, then the implementation commit) and recorded the harness gap as deferred;
      adding those scripts would change e90 scope.
  - at: '2026-11-06T17:40:00-03:00'
    gate: e90s04 verify (race gate red)
    decision: >-
      `go test -race` on deploy/functions/realtime/monitoring failed in TestDrainStatusHistory.
      Per the red-gate rule this was fixed at the cause, not retried: stopDeployment() wrote status
      with a raw UPDATE (bypassing status_history), and drainDeployment() skipped the draining
      transition whenever no in-memory app existed, so a second drain could force-stop a deployment
      mid-drain. Added forceStatus() plus an idempotent drain guard and a deterministic regression
      test (TestDrainWithoutRegisteredAppRecordsHistory). Race suite green afterwards.
  - at: '2026-11-06T18:05:00-03:00'
    gate: e90s05 verify (doc/impl drift)
    decision: >-
      scripts/gen-mcp-configs.sh tells contributors to run `make mcp`, but the Makefile was an
      untracked scratch file with no such target. Tracked the Makefile and added mcp/mcp-check,
      red-first (scripts/gen-mcp-configs.test.cjs).
  - at: '2026-11-06T18:20:00-03:00'
    gate: e90s07 verify (configuration drift not covered)
    decision: >-
      The drift script only checked prose. Extended it to compare the CI GO_VERSION/NODE_VERSION
      pins and the toolchain.toml Go floor against go.mod/.nvmrc, with fixture tests. The live
      values already matched, so this closes a blind gate rather than a live mismatch.
  - at: '2026-11-06T18:30:00-03:00'
    gate: CI enforcement of new gate tests
    decision: >-
      The new fixture tests were local-only. Wired `node --test scripts/*.test.cjs` into the verify
      job and added `make test-scripts`, so a gate that silently stops detecting drift fails CI.
  - at: '2026-11-06T18:35:00-03:00'
    gate: e90s01, s02, s03, s06, s08 stories
    decision: >-
      These stories were already implemented and green in earlier commits (147b7116b, ba742d460,
      9ca155487, b6139996c). Instead of re-implementing, each verify command was executed and
      recorded, the pre-fix state was proven from git history, and two genuine drift fixes landed:
      the leftover "REQUIRED First Call" claim in AGENTS.md and the stray <stdin> pattern in
      .gitignore.
  - at: '2026-11-06T18:50:00-03:00'
    gate: e90s04 race gate (timeout + one unreproduced failure)
    decision: >-
      The 4-package race suite first timed out under its 300s per-package budget (panic in
      TestStaticSidecar_BuildAndStart) on a loaded dev machine, and one later run failed at 423s
      without a captured test name or DATA RACE report. Raised the CI race job to -timeout 600s
      (2x headroom; job allows 20min) and re-ran the deploy race suite 10+ times to green,
      including -count=2, -count=3 and a -count=5 stress of the slow/flaky tests. The single 423s
      failure was not reproduced and no DATA RACE warning was ever observed; treated as a
      load-induced transient, recorded here rather than silently dropped.
